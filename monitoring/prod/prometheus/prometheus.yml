global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['otr-alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['otr-node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['otr-postgres-exporter:9187']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['otr-rabbitmq:15692']

  # RabbitMQ's default endpoint sums every queue together. This one reports
  # each queue's message counts, for the per-queue alerts.
  - job_name: 'rabbitmq-queues'
    metrics_path: '/metrics/detailed'
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['otr-rabbitmq:15692']

  - job_name: 'web'
    metrics_path: '/api/metrics'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['otr-web:3000']

  - job_name: 'data-worker'
    static_configs:
      - targets: ['otr-data-worker:9091']

  - job_name: 'tempo'
    static_configs:
      - targets: ['otr-tempo:3200']
