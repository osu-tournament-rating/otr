groups:
  - name: infrastructure
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage detected

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage detected

      # Archives write a dump and delete it after upload, so a short drop is
      # normal. This needs the trend to hold for an hour on a disk already
      # under 30% free.
      - alert: DiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.3
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.mountpoint }} will be full within a day at the current rate'

      - alert: OOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: The kernel killed a process for running out of memory

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Disk space running low

  - name: database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is down

      # restart: unless-stopped brings a crashing database back within seconds,
      # too fast for PostgreSQLDown.
      - alert: PostgreSQLRestarting
        expr: changes(pg_postmaster_start_time_seconds[15m]) > 2
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL restarted {{ $value }} times in 15 minutes

      - alert: PostgreSQLConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL is using {{ $value | humanizePercentage }} of its connections

      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Deadlocks on {{ $labels.datname }}

      - alert: PostgreSQLDatabaseGrowth
        expr: |
          (pg_database_size_bytes - pg_database_size_bytes offset 1d)
            / pg_database_size_bytes offset 1d > 0.25
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.datname }} grew by {{ $value | humanizePercentage }} in a day'

  # The data worker's jobs table in PostgreSQL. The worker exports its counts
  # by queue and state, and whether each queue's loop is claiming jobs.
  - name: jobs
    rules:
      # Delayed jobs count: during an osu! outage, jobs waiting out a retry
      # backoff are still backlog. The osu! queue routinely holds about 1,000
      # jobs, so it alerts higher.
      - alert: JobQueueDepthHigh
        expr: |
          sum by (queue) (data_worker_jobs{queue="data.osu", state=~"ready|delayed|running"}) > 2500
          or
          sum by (queue) (data_worker_jobs{queue!="data.osu", state=~"ready|delayed|running"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value }} jobs are waiting in {{ $labels.queue }}'

      # A job is parked after five failed attempts, and nothing retries it.
      - alert: JobsFailed
        expr: increase(data_worker_queue_messages_processed_total{status="parked"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.0f" $value }} more jobs failed for good in {{ $labels.queue }}'

      # Errors and parked jobs count as finished, so an osu! outage doesn't
      # fire this. The loop is inactive while stopped or paused for the
      # maintenance window, which holds jobs back on purpose.
      - alert: JobsStalled
        expr: |
          (sum by (queue) (data_worker_jobs{state="ready"}) > 0)
          and on (queue) (sum by (queue) (increase(data_worker_queue_messages_processed_total[15m])) == 0)
          and on (queue) (max by (queue) (data_worker_jobs_loop_active) == 1)
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: Jobs are ready in {{ $labels.queue }}, but the worker has finished none in 15 minutes

  - name: application
    rules:
      # Mostly down rather than always down, so a crash loop that answers the
      # odd scrape still counts.
      - alert: TargetDown
        expr: avg_over_time(up[10m]) < 0.5
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape {{ $labels.job }}
          description: Alerts built on its metrics stay silent while it is down.

      # Each deploy restarts both, and back-to-back merges deploy about every
      # five minutes, so it takes more than that to count as a crash loop.
      - alert: ServiceRestarting
        expr: changes(process_start_time_seconds{job=~"web|data-worker"}[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} restarted {{ $value }} times in 15 minutes'

      # Server errors only: 503s come from the weekly maintenance window, and
      # PostgreSQLDown covers a database outage.
      - alert: WebServerErrorRate
        expr: |
          sum(rate(web_orpc_procedure_calls_total{code=~"5..",code!="503"}[10m]))
            / sum(rate(web_orpc_procedure_calls_total[10m])) > 0.05
          and sum(rate(web_orpc_procedure_calls_total[10m])) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '{{ $value | humanizePercentage }} of site requests are failing with server errors'

      - alert: WebSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(web_orpc_procedure_duration_seconds_bucket[10m]))) > 2
          and sum(rate(web_orpc_procedure_duration_seconds_count[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The slowest 5% of site requests take over {{ $value | humanizeDuration }}

      # One IP making most of the anonymous calls, at a rate no reader keeps
      # up for half an hour: about one call a second. The web dashboard's
      # Visitors and API keys row has the source's calls.
      - alert: AnonymousSourceDominates
        expr: |
          max(web_anonymous_top_source_calls / clamp_min(web_anonymous_window_calls, 1)) > 0.5
          and max(web_anonymous_top_source_calls) >= 300
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: One source made {{ $value | humanizePercentage }} of anonymous calls for 30 minutes

      # Keys over their 60-a-minute limit for a quarter of an hour. The web
      # dashboard's Visitors and API keys row shows whose.
      - alert: ApiKeyRateLimited
        expr: sum(increase(web_api_key_rejections_total{reason="rate_limited"}[15m])) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: API keys were refused {{ printf "%.0f" $value }} times for their rate limit in 15 minutes

      - alert: OsuApiErrors
        expr: |
          sum(rate(data_worker_osu_api_requests_total{status="error"}[10m]))
            / sum(rate(data_worker_osu_api_requests_total[10m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanizePercentage }} of osu! API requests are failing'

      # Some resources answer 401 or 403 on their own; almost every request
      # doing so points at the API credentials.
      - alert: OsuApiUnauthorized
        expr: |
          sum(rate(data_worker_osu_api_requests_total{status="unauthorized"}[10m]))
            / sum(rate(data_worker_osu_api_requests_total[10m])) > 0.9
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The osu! API rejects almost every request, so check the API credentials

      - alert: OsuTrackApiErrors
        expr: |
          sum(rate(data_worker_osutrack_api_requests_total{status="error"}[30m]))
            / sum(rate(data_worker_osutrack_api_requests_total[30m])) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanizePercentage }} of osu!track requests are failing'

      # The rules above wait out blips for 25 minutes or more, so a short
      # outage never reaches them. These catch one within minutes. Both
      # limiters allow 60 requests a minute, so 20 errors in 5 minutes is a
      # real share of the traffic, not a stray failure.
      - alert: OsuApiErrorSpike
        expr: |
          sum(increase(data_worker_osu_api_requests_total{status="error"}[5m])) >= 20
          and
          sum(rate(data_worker_osu_api_requests_total{status="error"}[5m]))
            / sum(rate(data_worker_osu_api_requests_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.0f" $value }} osu! API requests failed in the last 5 minutes'

      - alert: OsuTrackApiErrorSpike
        expr: |
          sum(increase(data_worker_osutrack_api_requests_total{status="error"}[5m])) >= 20
          and
          sum(rate(data_worker_osutrack_api_requests_total{status="error"}[5m]))
            / sum(rate(data_worker_osutrack_api_requests_total[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.0f" $value }} osu!track requests failed in the last 5 minutes'

      # API-key traffic is a sliver of the site's, so WebServerErrorRate can
      # miss a public API outage. 503s come from the maintenance window.
      - alert: PublicApiErrorSpike
        expr: |
          sum(increase(web_orpc_procedure_calls_total{accessMethod="api-key",code=~"5..",code!="503"}[5m])) >= 20
          and
          sum(rate(web_orpc_procedure_calls_total{accessMethod="api-key",code=~"5..",code!="503"}[5m]))
            / sum(rate(web_orpc_procedure_calls_total{accessMethod="api-key",code!="503"}[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.0f" $value }} public API requests failed with server errors in the last 5 minutes'

      - alert: HighErrorRate
        expr: rate(data_worker_queue_messages_processed_total{status="error"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High error rate in queue processing

      - alert: RateLimiterBackpressure
        expr: data_worker_rate_limiter_queued_tasks > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Rate limiter queue building up

  # apps/scripts records how each cron run ended in node-exporter's textfile
  # collector (src/lib/metrics.py). A run is overdue when none has finished
  # within its cron interval plus some slack for the run's length. The
  # intervals follow the production crontab, which lives on the host and runs
  # in UTC: the production archive every 6 hours, the public archive and the
  # processor every Tuesday, and the public index every hour.
  # Each overdue rule has a never-recorded twin that waits as long, for a run
  # that has recorded nothing at all, such as one whose cron entry is broken.
  - name: scripts
    rules:
      - alert: ScriptRunFailed
        expr: otr_script_last_run_success == 0
        labels:
          severity: critical
        annotations:
          summary: The last {{ $labels.script }}{{ with $labels.bucket }} {{ . }}{{ end }} run failed
          description: Its log is in the scripts' log directory on the production host.

      - alert: ScriptRunOverdue
        expr: time() - otr_script_last_run_timestamp_seconds{script="archive",bucket="production"} > 8 * 3600
        labels:
          severity: critical
          script: archive
          bucket: production
        annotations:
          summary: No archive production run has finished in 8 hours
      - alert: ScriptRunNeverRecorded
        expr: absent(otr_script_last_run_timestamp_seconds{script="archive",bucket="production"})
        for: 8h
        labels:
          severity: critical
          script: archive
          bucket: production
        annotations:
          summary: No archive production run has been recorded in 8 hours

      - alert: ScriptRunOverdue
        expr: time() - otr_script_last_run_timestamp_seconds{script="archive",bucket="public"} > 7 * 86400 + 6 * 3600
        labels:
          severity: warning
          script: archive
          bucket: public
        annotations:
          summary: No archive public run has finished in 7 days
      - alert: ScriptRunNeverRecorded
        expr: absent(otr_script_last_run_timestamp_seconds{script="archive",bucket="public"})
        for: 174h
        labels:
          severity: warning
          script: archive
          bucket: public
        annotations:
          summary: No archive public run has been recorded in 7 days

      - alert: ScriptRunOverdue
        expr: time() - otr_script_last_run_timestamp_seconds{script="processor"} > 7 * 86400 + 6 * 3600
        labels:
          severity: critical
          script: processor
        annotations:
          summary: No processor run has finished in 7 days
      - alert: ScriptRunNeverRecorded
        expr: absent(otr_script_last_run_timestamp_seconds{script="processor"})
        for: 174h
        labels:
          severity: critical
          script: processor
        annotations:
          summary: No processor run has been recorded in 7 days

      - alert: ScriptRunOverdue
        expr: time() - otr_script_last_run_timestamp_seconds{script="refresh-index"} > 3 * 3600
        labels:
          severity: warning
          script: refresh-index
        annotations:
          summary: No refresh-index run has finished in 3 hours
      - alert: ScriptRunNeverRecorded
        expr: absent(otr_script_last_run_timestamp_seconds{script="refresh-index"})
        for: 3h
        labels:
          severity: warning
          script: refresh-index
        annotations:
          summary: No refresh-index run has been recorded in 3 hours
