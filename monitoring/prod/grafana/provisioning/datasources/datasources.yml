apiVersion: 1

# Grafana updates matched datasources by uid and aborts startup when it differs.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://otr-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://otr-loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherType: regex
          matcherRegex: 'traceId=([a-f0-9]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'View trace'

  # Product panels read production through a role that cannot write or see
  # credentials (web migration 0041). Its password is Grafana's own secret
  # key, which scripts/run-migrations.ts sets on every deploy and recovery.
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: postgres
    access: proxy
    url: db:5432
    user: otr_grafana_read_only
    editable: false
    jsonData:
      database: ${OTR_DB_NAME}
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 2
      timeInterval: 1m
    secureJsonData:
      password: ${GF_SECURITY_SECRET_KEY}

  # Shows the alerts Prometheus raises, and lets operators silence one, since
  # Alertmanager publishes no port of its own.
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://otr-alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://otr-tempo:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
        metrics: true
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: service
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        queries:
          - name: 'Request rate'
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[$$__rate_interval]))'
          - name: 'Error rate'
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[$$__rate_interval]))'
