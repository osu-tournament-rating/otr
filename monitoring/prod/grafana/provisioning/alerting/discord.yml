# Alertmanager sends alerts to Discord now (monitoring/prod/alertmanager), and
# Grafana has no alert rules of its own. This removes the Discord contact point
# and notification policy this file used to provision. It keeps the old name
# because deploy copies monitoring/ onto the host without deleting files, so a
# renamed file would leave the old one provisioning them again.
apiVersion: 1

resetPolicies:
  - 1

deleteContactPoints:
  - orgId: 1
    uid: discord-webhook
