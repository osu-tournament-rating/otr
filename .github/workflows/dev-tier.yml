name: Dev tier

# The shared database and queue that PR previews read from. Deliberately kept
# out of deploy.yml: this tier has no application images and no migrate
# service, so it does not fit that workflow's build-and-migrate shape.
#
# A deploy and the nightly run install scripts/preview from the default branch
# at <DEV_REMOTE_PATH>/scripts/preview, where previews run it. They also
# install the operations scripts in apps/scripts at
# <DEV_REMOTE_PATH>/apps/scripts, with the dev environment's SCRIPTS_ENV secret
# as their .env. dev-db.sh restores the replica with them. Only a deploy
# replaces the tier's .env and docker-compose.yml, so a push to the default
# branch that changes scripts/preview or docker-compose-dev.yml runs one.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to run'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - restore
          - check
          - reap
          - reap-dry-run
  schedule:
    # Nightly replica refresh, after the processor run at 12:00 UTC.
    - cron: '0 14 * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/preview/**'
      - 'docker-compose-dev.yml'

concurrency:
  group: dev-tier
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    name: ${{ github.event.inputs.action || (github.event_name == 'push' && 'deploy') || 'nightly' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      # A push only runs when files a deploy installs have changed.
      ACTION: ${{ github.event.inputs.action || (github.event_name == 'push' && 'deploy') || 'nightly' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch accepts any branch, and this job runs
          # scripts/preview on the deployment host. Take them from the default
          # branch whatever branch the run was started from.
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          sparse-checkout: |
            docker-compose-dev.yml
            scripts/preview
            apps/web/drizzle
            apps/scripts
            .github/scripts

      - name: Resolve the expected journal
        id: journal
        run: |
          set -euo pipefail
          # The pair drizzle records for every migration it applies: the
          # journal's `when` and the sha256 of the .sql file. The host has
          # neither jq nor the migrations.
          list=$(jq -r '.entries[] | "\(.when) \(.tag)"' apps/web/drizzle/meta/_journal.json |
            while read -r when tag; do
              echo "$when $(sha256sum "apps/web/drizzle/${tag}.sql" | cut -d' ' -f1)"
            done)
          echo "expected=$(base64 -w0 <<<"$list")" >> "$GITHUB_OUTPUT"
          # The host migrates with these same files rather than the ones in
          # its image, which can trail the default branch.
          tar -czf "$RUNNER_TEMP/migrations.tar.gz" \
            apps/web/drizzle/meta/_journal.json apps/web/drizzle/*.sql

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Upload dev tier assets
        if: ${{ env.ACTION == 'deploy' }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          ENV_CONTENT: ${{ secrets.DEV_ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_CONTENT" > .env
          cp docker-compose-dev.yml docker-compose.yml
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            mkdir -p "$DEV_REMOTE_PATH"
          scp -o StrictHostKeyChecking=no .env docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEV_REMOTE_PATH/"

      # Previews run the host's copy, so the nightly run installs it too, not
      # only a deploy. As in deploy-ops-scripts.sh, each install unpacks into
      # its own directory and scripts/preview is a symlink moved to it in one
      # rename. preview.yml reads the copy without dev-db.sh's lock, so it
      # finds either the old copy or the new one, never neither. The swap
      # still waits for that lock, so a dev-db.sh run that holds it keeps one
      # copy from start to finish.
      - name: Install the preview scripts
        if: ${{ contains(fromJSON('["deploy", "nightly"]'), env.ACTION) }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/preview.tar.gz" -C scripts preview
          # mktemp -d makes the upload directory private to the deploying user,
          # and the script below removes it.
          upload=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" mktemp -d)
          scp -o StrictHostKeyChecking=no -q "$RUNNER_TEMP/preview.tar.gz" \
            "$SSH_USER@$SSH_HOST:$upload/"

          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEV_REMOTE_PATH" "$upload" <<'EOF'
            set -euo pipefail
            cd "$1"
            mkdir -p scripts
            # Installs sit beside the link, named by time so sorting the names
            # sorts the installs. At the same depth as scripts/preview, the
            # ../.. dev-db.sh climbs to find apps/scripts reaches this
            # directory whether or not the link is resolved.
            release="$(mktemp -d "scripts/.preview-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")"
            name="${release##*/}"
            installed=false
            trap 'rm -rf "$2"; [[ "$installed" == true ]] || rm -rf "$release"' EXIT
            tar -xzf "$2/preview.tar.gz" -C "$release" --strip-components=1
            chmod 755 "$release"
            chmod +x "$release/dev-db.sh"
            # A copy that cannot report its version never goes live. The rest
            # of this script is bash's stdin, so the check gets /dev/null.
            "$release/dev-db.sh" capabilities </dev/null

            exec 9>.dev-db.lock
            flock -w 1800 -x 9 || {
              echo "another dev tier operation still holds the lock after 1800s" >&2
              exit 1
            }
            # rename(2) swaps the symlink in one step. It cannot replace a
            # real directory, and -T refuses to move the link into one, so the
            # first install over the old real directory moves it aside first,
            # named by when it was installed so it sorts oldest. That install
            # alone leaves a moment with no scripts/preview.
            ln -sfn "$name" scripts/.preview-next
            if [[ -d scripts/preview && ! -L scripts/preview ]]; then
              mv -T scripts/preview \
                "scripts/.preview-$(date -u -r scripts/preview +%Y%m%dT%H%M%SZ)-legacy"
            fi
            mv -T scripts/.preview-next scripts/preview
            installed=true
            echo "scripts/preview now points at install $name"

            # The two installs before this one are kept, because a run that
            # started before the swap can still be reading its files.
            find scripts -mindepth 1 -maxdepth 1 -type d -name '.preview-[0-9]*' -printf '%f\n' |
              sort -r | { grep -vxF "$name" || true; } | tail -n +3 |
              while IFS= read -r old; do
                rm -rf "scripts/$old"
                echo "removed install $old"
              done
          EOF

      - name: Bring up dev tier
        if: ${{ env.ACTION == 'deploy' }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEV_REMOTE_PATH" <<'EOF'
            set -euo pipefail
            cd "$1"
            docker compose pull
            docker compose up -d --remove-orphans
            # Nothing consumes these queues without a data worker, so let idle
            # ones delete themselves after a day.
            until docker exec otr-dev-rabbitmq rabbitmq-diagnostics -q ping </dev/null; do sleep 3; done
            docker exec otr-dev-rabbitmq rabbitmqctl set_policy preview-expiry \
              '.*' '{"expires":86400000}' --apply-to queues </dev/null
          EOF

      - name: Install the operations scripts
        if: ${{ contains(fromJSON('["deploy", "nightly"]'), env.ACTION) }}
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          SCRIPTS_ENV: ${{ secrets.SCRIPTS_ENV }}
        run: |
          bash .github/scripts/deploy-ops-scripts.sh apps/scripts \
            "$SSH_USER@$SSH_HOST" "$DEV_REMOTE_PATH"

      - name: Run database operation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          PREVIEW_REMOTE_PATH: ${{ secrets.PREVIEW_REMOTE_PATH }}
          EXPECTED_JOURNAL: ${{ steps.journal.outputs.expected }}
        run: |
          set -euo pipefail
          . scripts/preview/dev-db-lib.sh
          # Resolved here; the host has no GitHub token.
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --limit 200 --json number --jq '.[].number')
          echo "$(count_lines "$open_prs") open pull requests"

          # mktemp -d makes the upload directory private to the deploying user,
          # and the script below removes it.
          upload=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" mktemp -d)
          scp -o StrictHostKeyChecking=no -q "$RUNNER_TEMP/migrations.tar.gz" \
            "$SSH_USER@$SSH_HOST:$upload/"

          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEV_REMOTE_PATH" "$ACTION" \
            "$EXPECTED_JOURNAL" "$(base64 -w0 <<<"$open_prs")" "$PREVIEW_REMOTE_PATH" \
            "$upload" <<'EOF'
            set -euo pipefail
            cd "$1"
            trap 'rm -rf "$6"' EXIT
            EXPECTED_JOURNAL="$(printf %s "$3" | base64 -d)"
            OPEN_PRS="$(printf %s "$4" | base64 -d)"
            export EXPECTED_JOURNAL OPEN_PRS
            export PREVIEW_REMOTE_PATH="$5"
            export MIGRATIONS_ARCHIVE="$6/migrations.tar.gz"

            case "$2" in
              deploy) ./scripts/preview/dev-db.sh sync ;;
              check) ./scripts/preview/dev-db.sh check ;;
              restore) ./scripts/preview/dev-db.sh restore ;;
              reap) ./scripts/preview/dev-db.sh reap ;;
              reap-dry-run) ./scripts/preview/dev-db.sh reap --dry-run ;;
              nightly)
                ./scripts/preview/dev-db.sh restore
                ./scripts/preview/dev-db.sh reap
                docker image prune -f
                ;;
            esac
          EOF
