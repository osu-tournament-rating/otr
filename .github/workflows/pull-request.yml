name: Pull request

# The title becomes the squash commit on master, and the changelog becomes the
# GitHub release when the merge deploys, so both are checked before merge. A
# pull request that edits or deletes an existing test must also say why.

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  # Lists the pull request's changed files for the changed-tests check.
  pull-requests: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      # The base branch's checker, so a pull request cannot loosen its own check.
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x

      - name: Check title and changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun .github/scripts/release-notes.ts check

      # Reads the changed files from the API, because this job checks out only
      # the base branch's scripts. Runs again on every push and edit, so a test
      # changed by a later fix needs its reason too.
      - name: Check changed tests are explained
        # Reports even when the title or changelog check above fails.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -o pipefail
          # The pull request that adds this check runs before its base has it.
          if [[ ! -f .github/scripts/tests-changed.ts ]]; then
            echo "The base branch has no changed-tests check yet."
            exit 0
          fi
          gh api --paginate --slurp "$FILES" | bun .github/scripts/tests-changed.ts check
