name: PR preview

# Publishes a labelled PR to a private tailnet URL. Runs the website only:
# the database comes from the shared dev tier, and no data worker
# means previews never call the osu! API.
#
# A preview runs pull-request code on the deployment host, which also hosts
# personal services, so trust is settled in `authorize` before anything is
# built. Forks never deploy under any path: `pull_request` withholds secrets
# from them, and the comment override re-checks that the branch lives here.
#
# The `preview` label is the switch. Only a labelled pull request that changes
# the website deploys, even with a `!deploy` comment. Removing the label or
# closing the pull request tears the preview down, and a pull request that
# never had the label leaves the deployment host alone.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  issue_comment:
    types: [created]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  authorize:
    name: Authorize preview
    # Other labels coming and going change nothing about the preview, so they
    # do not redeploy it.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.action != 'unlabeled' &&
       (github.event.action != 'labeled' || github.event.label.name == 'preview')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '!deploy'))
    runs-on: ubuntu-latest

    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      pr: ${{ steps.decide.outputs.pr }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
      default_branch: ${{ steps.decide.outputs.default_branch }}
      notify: ${{ steps.decide.outputs.notify }}
      reason: ${{ steps.decide.outputs.reason }}
      guarded: ${{ steps.decide.outputs.guarded }}

    steps:
      - name: Decide whether this pull request may run on the deployment host
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # Authors whose pull requests may change what runs on the host, and
          # who may authorize someone else's with a `!deploy` comment.
          TRUSTED: ${{ vars.PREVIEW_TRUSTED_AUTHORS || 'hburn7' }}
        run: |
          set -euo pipefail

          trusted() {
            local name
            for name in $TRUSTED; do
              [[ "$1" == "$name" ]] && return 0
            done
            return 1
          }

          # $1 comments the reason on the PR, $2 is the reason.
          skip() {
            {
              echo "deploy=false"
              echo "notify=$1"
              echo "reason=$2"
            } >> "$GITHUB_OUTPUT"
            echo "Not deploying: $2"
            exit 0
          }

          pull=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          head_sha=$(jq -r .head.sha <<<"$pull")
          {
            echo "pr=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "base_ref=$(jq -r .base.ref <<<"$pull")"
            echo "default_branch=$(jq -r .base.repo.default_branch <<<"$pull")"
          } >> "$GITHUB_OUTPUT"

          [[ "$(jq -r .head.repo.full_name <<<"$pull")" == "$REPO" ]] ||
            skip false "the branch is not in this repository"
          [[ "$(jq -r .state <<<"$pull")" == "open" ]] ||
            skip false "the pull request is closed"

          # Adding the label or commenting `!deploy` asks for a preview, so a
          # skip is explained on the pull request. Pushes skip quietly.
          asked=false
          if [[ "$EVENT" == "issue_comment" || "$ACTION" == "labeled" ]]; then
            asked=true
          fi

          jq -e '[.labels[].name] | index("preview")' <<<"$pull" >/dev/null ||
            skip "$asked" "the preview label is not applied"

          # A preview runs only the website, so a pull request that changes
          # nothing outside the docs, the processor, and the data worker has
          # nothing to preview.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename')
          grep -qvE '^(apps/(docs|processor|data-worker)/|$)' <<<"$files" ||
            skip "$asked" "this pull request changes only the docs, the processor, or the data worker"

          # `!deploy` vouches for whatever is at the head of the branch right
          # now. The SHA goes in the deployment comment so it is auditable, and
          # the next push has to be authorized again.
          if [[ "$EVENT" == "issue_comment" ]]; then
            trusted "$COMMENT_AUTHOR" ||
              skip true "@$COMMENT_AUTHOR cannot authorize a deployment"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Authorized by @$COMMENT_AUTHOR at $head_sha."
            exit 0
          fi

          author=$(jq -r .user.login <<<"$pull")
          if trusted "$author"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everyone else may change application code and nothing else. These
          # paths choose what runs on the host or reach postgres as superuser,
          # so touching one needs a `!deploy` comment after review.
          guarded='^\.github/|^docker-compose[^/]*\.ya?ml$|(^|/)Dockerfile|^\.dockerignore$|^scripts/|^preview/|^monitoring/|^apps/web/drizzle/|^drizzle\.config\.ts$|(^|/)package\.json$|(^|/)bun\.lock$|^\.husky/|\.sh$'
          hits=$(grep -E "$guarded" <<<"$files" || true)

          if [[ -n "$hits" ]]; then
            {
              echo "guarded<<FILES"
              echo "$hits"
              echo "FILES"
            } >> "$GITHUB_OUTPUT"
            skip true "@$author changed files that decide what runs on the deployment host"
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Say why no preview was deployed
        if: steps.decide.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.decide.outputs.pr }}
          REASON: ${{ steps.decide.outputs.reason }}
          GUARDED: ${{ steps.decide.outputs.guarded }}
        run: |
          set -euo pipefail
          body="No preview: ${REASON}."
          if [[ -n "${GUARDED:-}" ]]; then
            body=$(printf '%s\n\n```\n%s\n```\n\n%s' "$body" "$GUARDED" \
              'A maintainer can review these changes and comment `!deploy` to deploy this commit.')
          fi
          gh pr comment "$PR_NUMBER" --body "$body"

  deploy:
    name: Deploy preview
    needs: authorize
    if: needs.authorize.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: dev

    env:
      PR_NUMBER: ${{ needs.authorize.outputs.pr }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The exact commit authorize approved, never a moving ref.
          ref: ${{ needs.authorize.outputs.head_sha }}
          fetch-depth: 0

      - name: Resolve preview context
        id: context
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
          DEV_LIVE_DB: ${{ vars.DEV_LIVE_DB || 'otr_dev' }}
          BASE_REF: ${{ needs.authorize.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ needs.authorize.outputs.default_branch }}
        run: |
          set -euo pipefail
          . scripts/preview/dev-db-lib.sh

          hostname="otr-pr-${PR_NUMBER}"
          {
            echo "hostname=$hostname"
            echo "url=https://${hostname}.${TS_TAILNET}"
            echo "project=otr-pr-${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

          journal() {
            local ref="$1" when tag
            git show "$ref:apps/web/drizzle/meta/_journal.json" |
              jq -r '.entries[] | "\(.when) \(.tag)"' |
              while read -r when tag; do
                echo "$when $(git show "$ref:apps/web/drizzle/${tag}.sql" |
                  sha256sum | cut -d' ' -f1)"
              done
          }

          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          # The host migrates the shared database with these files rather than
          # the ones in its image, which can trail the default branch. The base
          # journal is computed from the same bytes, so what the migrator
          # applies and what verify expects cannot drift apart. Inline, not in
          # dev-db-lib.sh, because that file comes from the pull request's head.
          migrations="$RUNNER_TEMP/migrations"
          mkdir -p "$migrations"
          git archive --format=tar "origin/${DEFAULT_BRANCH}" -- \
            apps/web/drizzle/meta/_journal.json ':(glob)apps/web/drizzle/*.sql' |
            tar -xf - -C "$migrations"
          tar -czf "$RUNNER_TEMP/migrations.tar.gz" -C "$migrations" apps
          base_journal="$(cd "$migrations" &&
            jq -r '.entries[] | "\(.when) \(.tag)"' apps/web/drizzle/meta/_journal.json |
            while read -r when tag; do
              echo "$when $(sha256sum "apps/web/drizzle/${tag}.sql" | cut -d' ' -f1)"
            done)"
          head_journal="$(journal HEAD)"

          # The shared database tracks the default branch.
          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" ]]; then
            verdict=isolate
            reason="the pull request is not based on $DEFAULT_BRANCH"
          else
            read -r verdict reason <<<"$(decide_isolation "$base_journal" "$head_journal")"
          fi
          echo "isolation: $verdict, $reason"

          if [[ "$verdict" == "rebase-required" ]]; then
            {
              echo "No preview: $reason."
              echo
              echo "The migrator applies only entries newer than the newest one already"
              echo "applied, so this migration would be skipped without an error and the"
              echo "preview would serve new code against the old schema. Rebase onto"
              echo "\`$DEFAULT_BRANCH\` and regenerate the migration."
            } > "$RUNNER_TEMP/preview-comment.md"
            echo "::error::$reason"
            exit 1
          fi

          if [[ "$verdict" == "isolate" ]]; then
            database="otr_pr_${PR_NUMBER}"
            expected_journal="$head_journal"
          else
            database="$DEV_LIVE_DB"
            expected_journal="$base_journal"
          fi

          {
            echo "database=$database"
            echo "isolate=$([[ "$verdict" == "isolate" ]] && echo true || echo false)"
            echo "behind=$([[ "$verdict" == "share-behind" ]] && echo true || echo false)"
            echo "base_journal=$(base64 -w0 <<<"$base_journal")"
            echo "expected_journal=$(base64 -w0 <<<"$expected_journal")"
          } >> "$GITHUB_OUTPUT"

      - name: Connect to tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      # The host runs whatever copy the last Dev tier deploy or nightly run put
      # there, so settle that before spending a build on it. A version 2 copy
      # ignores the migrations this run uploads and uses its image's.
      # Production shares the host's Docker daemon and pulls that image on
      # every deploy, so this fails only while production has yet to deploy
      # the newest migration, and it warns.
      - name: Check the host database script
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          DEFAULT_BRANCH: ${{ needs.authorize.outputs.default_branch }}
        run: |
          set -euo pipefail
          reported=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEV_REMOTE_PATH" 2>/dev/null <<'EOF'
            cd "$1"
            ./scripts/preview/dev-db.sh capabilities 2>/dev/null || true
          EOF
          ) || true
          version=$(sed -n 's/^version=//p' <<<"$reported")

          if [[ ! "$version" =~ ^[0-9]+$ ]] || (( version < 2 )); then
            {
              echo "No preview: the deployment host is running an older \`scripts/preview/dev-db.sh\`."
              echo
              echo "It reports API version \`${version:-none}\` and this workflow needs \`2\`. Run the"
              echo "\`Dev tier\` workflow with the \`deploy\` action to copy the current scripts to the"
              echo "host, then push again or comment \`!deploy\` to retry."
            } > "$RUNNER_TEMP/preview-comment.md"
            echo "::error::the host dev-db.sh reports API version ${version:-none} and this workflow needs 2; run the Dev tier deploy action first"
            exit 1
          fi
          if (( version < 3 )); then
            echo "::warning::the host dev-db.sh reports API version $version; it migrates the shared database with its image's migrations, not ${DEFAULT_BRANCH}'s. Run the Dev tier deploy action."
          fi
          echo "host dev-db.sh API version $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Identify the web build
        id: web-build
        run: echo "id=$(bash .github/scripts/web-build-id.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: stagecodes/otr-web:pr-${{ env.PR_NUMBER }}
          build-args: OTR_BUILD_ID=${{ steps.web-build.outputs.id }}
          # Shared read cache plus a per-PR layer; the GHA cache budget is 10 GB.
          cache-from: |
            type=gha,scope=web
            type=gha,scope=web-pr-${{ env.PR_NUMBER }}
          cache-to: type=gha,scope=web-pr-${{ env.PR_NUMBER }},mode=min,ignore-error=true

      - name: Prepare the preview database
        id: database
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          BASE_JOURNAL: ${{ steps.context.outputs.base_journal }}
          EXPECTED_JOURNAL: ${{ steps.context.outputs.expected_journal }}
          ISOLATE: ${{ steps.context.outputs.isolate }}
          PREVIEW_DB: ${{ steps.context.outputs.database }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # mktemp -d makes the upload directory private to the deploying user,
          # and the script below removes it.
          upload=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" mktemp -d)
          scp -o StrictHostKeyChecking=no -q "$RUNNER_TEMP/migrations.tar.gz" \
            "$SSH_USER@$SSH_HOST:$upload/"

          status=0
          output=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEV_REMOTE_PATH" "$BASE_JOURNAL" \
            "$EXPECTED_JOURNAL" "$ISOLATE" "$PREVIEW_DB" "$upload" 2>&1 <<'EOF'
            set -euo pipefail
            cd "$1"
            trap 'rm -rf "$6"' EXIT
            export MIGRATIONS_ARCHIVE="$6/migrations.tar.gz"
            EXPECTED_JOURNAL="$(printf %s "$2" | base64 -d)" ./scripts/preview/dev-db.sh sync
            if [[ "$4" == "true" ]]; then
              # A clone that finds the seed broken restores it from the
              # default branch's migrations, and checks it against those.
              EXPECTED_JOURNAL="$(printf %s "$3" | base64 -d)" \
                SEED_JOURNAL="$(printf %s "$2" | base64 -d)" \
                ./scripts/preview/dev-db.sh clone "$5"
            else
              ./scripts/preview/dev-db.sh info "$5"
            fi
          EOF
          ) || status=$?
          echo "$output"

          if (( status != 0 )); then
            case "$status" in
              3) reason="the dev tier refused to prepare \`$PREVIEW_DB\`" ;;
              4) reason="another dev tier operation is still running; retry once it finishes" ;;
              *) reason="preparing \`$PREVIEW_DB\` on the dev tier failed with exit $status" ;;
            esac
            {
              echo "No preview: $reason."
              echo
              echo "\`Prepare the preview database\` failed; the output is in the [run log]($RUN_URL)."
            } > "$RUNNER_TEMP/preview-comment.md"
            echo "::error::$reason"
            exit 1
          fi

          {
            echo "size=$(sed -n 's/^size_pretty=//p' <<<"$output" | tail -1)"
            echo "data_age=$(sed -n 's/^data_age_seconds=//p' <<<"$output" | tail -1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload preview assets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PREVIEW_REMOTE_PATH: ${{ secrets.PREVIEW_REMOTE_PATH }}
          ENV_CONTENT: ${{ secrets.PREVIEW_ENV }}
          # Scoped to tag:preview alone, not the tag:ci client used above.
          TS_CLIENT_ID: ${{ secrets.TS_PREVIEW_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_PREVIEW_SECRET }}
          PREVIEW_URL: ${{ steps.context.outputs.url }}
          PREVIEW_HOSTNAME: ${{ steps.context.outputs.hostname }}
          PREVIEW_DB: ${{ steps.context.outputs.database }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_CONTENT" > .env

          # Per-PR values, appended so the later key wins.
          cat >> .env <<ENVFILE
          IMAGE_TAG=pr-${PR_NUMBER}
          PREVIEW_URL=${PREVIEW_URL}
          PREVIEW_HOSTNAME=${PREVIEW_HOSTNAME}
          TS_CLIENT_ID=${TS_CLIENT_ID}
          TS_CLIENT_SECRET=${TS_CLIENT_SECRET}
          ENVFILE

          # Migration PRs point at their own clone, reusing the credentials
          # already in DOCKER_DATABASE_URL rather than repeating them.
          base=$(grep '^DOCKER_DATABASE_URL=' .env | tail -1 | cut -d= -f2-)
          echo "DOCKER_DATABASE_URL=${base%/*}/${PREVIEW_DB}" >> .env

          cp docker-compose-preview.yml docker-compose.yml
          remote="$PREVIEW_REMOTE_PATH/pr-${PR_NUMBER}"
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" mkdir -p "$remote"
          scp -o StrictHostKeyChecking=no -r \
            .env docker-compose.yml preview/ts-config \
            "$SSH_USER@$SSH_HOST:$remote/"

      - name: Migrate and start the preview stack
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PREVIEW_REMOTE_PATH: ${{ secrets.PREVIEW_REMOTE_PATH }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          PROJECT: ${{ steps.context.outputs.project }}
          NEEDS_MIGRATE: ${{ steps.context.outputs.isolate }}
          EXPECTED_JOURNAL: ${{ steps.context.outputs.expected_journal }}
          PREVIEW_DB: ${{ steps.context.outputs.database }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status=0
          output=$(ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$PREVIEW_REMOTE_PATH/pr-${PR_NUMBER}" "$PROJECT" \
            "$NEEDS_MIGRATE" "$DEV_REMOTE_PATH" "$EXPECTED_JOURNAL" "$PREVIEW_DB" 2>&1 <<'EOF'
            set -euo pipefail
            cd "$1"
            docker compose -p "$2" pull
            . "$4/scripts/preview/dev-db-lib.sh"

            migration=0
            if [[ "$3" == "true" ]]; then
              # compose run attaches stdin, which is this script
              log="$(docker compose -p "$2" --profile migrate run --rm -T migrate 2>&1 </dev/null)" || migration=$?
              redact <<<"$log"
            fi
            if (( migration == 0 )); then
              (
                cd "$4"
                EXPECTED_JOURNAL="$(printf %s "$5" | base64 -d)" \
                  ./scripts/preview/dev-db.sh verify "$6"
              ) || migration=$?
            fi
            if (( migration != 0 )); then
              docker compose -p "$2" down --remove-orphans
              exit 1
            fi

            docker compose -p "$2" up -d --remove-orphans
          EOF
          ) || status=$?
          echo "$output"

          if (( status != 0 )); then
            {
              echo "No preview: the migration failed and the stack was stopped."
              echo "\`$PREVIEW_DB\` was left in place for diagnosis."
              echo
              echo "\`Migrate and start the preview stack\` failed; the output is in the [run log]($RUN_URL)."
            } > "$RUNNER_TEMP/preview-comment.md"
            echo "::error::the preview migration failed"
            exit 1
          fi

      - name: Comment preview status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PREVIEW_URL: ${{ steps.context.outputs.url }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          PREVIEW_DB: ${{ steps.context.outputs.database }}
          BEHIND: ${{ steps.context.outputs.behind }}
          DEFAULT_BRANCH: ${{ needs.authorize.outputs.default_branch }}
          SIZE: ${{ steps.database.outputs.size }}
          DATA_AGE: ${{ steps.database.outputs.data_age }}
        run: |
          set -euo pipefail
          message="$RUNNER_TEMP/preview-comment.md"

          if [[ ! -f "$message" ]]; then
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo "no preview message to report for a $JOB_STATUS"
              exit 0
            fi
            age="of unknown age"
            if [[ "${DATA_AGE:-}" =~ ^[0-9]+$ ]]; then
              age="$((DATA_AGE / 86400)) days old"
            fi
            size="size unknown"
            if [[ "${SIZE:-}" =~ ^[0-9]+([.][0-9]+)?[[:space:]](bytes|[kMGT]B)$ ]]; then
              size="$SIZE"
            fi
            {
              printf '%s\n\n' "Deployed \`${HEAD_SHA:0:7}\`: $PREVIEW_URL"
              printf '%s\n' "Database \`$PREVIEW_DB\`, $size, data $age."
              if [[ "$BEHIND" == "true" ]]; then
                printf '\n%s\n' "This branch is behind \`$DEFAULT_BRANCH\`, so the preview runs"
                printf '%s\n' "against the older schema. Rebase to preview against the current one."
              fi
            } > "$message"
          fi

          body=$(printf '<!-- otr-preview -->\n%s\n' "$(cat "$message")")

          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- otr-preview -->")) | .id')
          id=${found%%$'\n'*}

          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${id}" -f body="$body" >/dev/null
            echo "updated comment $id"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi

  teardown:
    name: Tear down preview
    # Only a pull request with the preview label can have a preview, and
    # removing the label tears it down then, so closing one without the label
    # has nothing to remove. The job runs in the dev environment, which GitHub
    # records as a deployment on the pull request, so it must not run for
    # nothing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    environment: dev

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Remove preview stack and database
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PREVIEW_REMOTE_PATH: ${{ secrets.PREVIEW_REMOTE_PATH }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$PREVIEW_REMOTE_PATH" "$DEV_REMOTE_PATH" "$PR_NUMBER" <<'EOF'
            set -euo pipefail
            directory="$1/pr-$3"
            if [[ -d "$directory" ]]; then
              cd "$directory"
              # No -v: the compose file names shared volumes.
              docker compose -p "otr-pr-$3" down --remove-orphans
              cd /
              rm -rf "$directory"
            fi
            docker image rm "stagecodes/otr-web:pr-$3" || true
            # The tailnet node is ephemeral and removes itself with the stack.
            cd "$2"
            ./scripts/preview/dev-db.sh drop "otr_pr_$3"
          EOF

      # Removing the label leaves the pull request open, so its preview
      # comment says the preview is gone instead of linking to it.
      - name: Mark the preview comment removed
        if: github.event.action == 'unlabeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- otr-preview -->")) | .id')
          id=${found%%$'\n'*}
          if [[ -n "$id" ]]; then
            body=$(printf '<!-- otr-preview -->\n%s\n' \
              "Preview removed with the \`preview\` label. Add the label again to redeploy.")
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${id}" -f body="$body" >/dev/null
          fi

      - name: Delete the preview image tag
        if: always()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Needs the delete scope, which the push steps do not.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: stagecodes/otr-web
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST https://hub.docker.com/v2/auth/token \
            -H 'content-type: application/json' \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg s "$DOCKERHUB_TOKEN" \
              '{identifier: $u, secret: $s}')")
          token=$(jq -r '.access_token // empty' <<<"$response" 2>/dev/null || true)
          [[ -n "$token" ]] || {
            echo "::error::could not exchange the Docker Hub credentials for a token"
            exit 1
          }

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/pr-${PR_NUMBER}/" \
            -H "Authorization: Bearer $token")

          case "$code" in
            204) echo "deleted ${IMAGE}:pr-${PR_NUMBER}" ;;
            404) echo "${IMAGE}:pr-${PR_NUMBER} was already gone" ;;
            401|403)
              echo "::error::the Docker Hub token cannot delete tags; it needs the delete scope"
              exit 1
              ;;
            *)
              echo "::error::unexpected $code deleting ${IMAGE}:pr-${PR_NUMBER}"
              exit 1
              ;;
          esac
