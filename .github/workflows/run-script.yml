name: Run script

# Runs the operations scripts in apps/scripts on a host, for a one-off archive
# or recovery. Nothing is checked out: the run uses the copy installed on the
# host and its .env. In production that is the copy the last deploy.yml run
# installed, from its release. On the dev host it is the copy dev-tier.yml last
# installed, from the default branch.
#
# The arguments go to src/main.py. They are split on whitespace, with no
# quoting and no globbing.
#
# The job waits for the script to finish and streams everything it prints,
# including its logs and the output of the commands it runs. The job fails when
# the script exits non-zero or the connection drops.
#
# A production run uses the production-ops environment rather than the
# production one deploys use, so it can wait for a reviewer's approval while
# deploys stay automatic. production-ops holds only SSH_USER; the run's other
# secrets come from the repository and the organization.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run in'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production
      args:
        description: 'Arguments for src/main.py, e.g. "-s recovery --recovery-bucket production"'
        required: true
        type: string

concurrency:
  group: run-script-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # The "production" choice runs in the production-ops environment, never
    # in the production environment deploys use. Other choices run in the
    # environment of the same name.
    environment: ${{ inputs.environment == 'production' && 'production-ops' || inputs.environment }}

    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Run script
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # The directory the scripts are installed under.
          REMOTE_PATH: ${{ inputs.environment == 'dev' && secrets.DEV_REMOTE_PATH || secrets.REMOTE_PATH }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?no SSH user is configured for this environment}"
          : "${REMOTE_PATH:?no remote path is configured for this environment}"
          # ssh joins its arguments into one remote command line, which would
          # split the arguments again on the host, so they travel encoded.
          # Keepalives make a dropped connection fail the job instead of
          # leaving it waiting.
          ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$REMOTE_PATH" "$(base64 -w0 <<<"$ARGS")" <<'EOF'
            set -euo pipefail
            cd "$1/apps/scripts"
            args="$(printf %s "$2" | base64 -d)"
            set -f
            # shellcheck disable=SC2086 # the arguments are split on purpose
            set -- $args
            echo "Running src/main.py $*"
            # One unbuffered stream keeps the script's logs and its
            # subprocesses' output in order. stdin is the rest of this
            # script, so nothing the script runs may read it.
            status=0
            PYTHONUNBUFFERED=1 .venv/bin/python src/main.py "$@" </dev/null 2>&1 ||
              status=$?
            echo "src/main.py exited with status $status"
            exit "$status"
          EOF
