name: Deploy

# Every merge to master becomes a GitHub release that links the merged pull
# request above its changelog, then ships to production. Running this workflow
# by hand redeploys an existing release, which is how a bad release is rolled
# back.
#
# Images are built while CI runs, under the commit's `sha-` tag. Once CI has
# passed, the release job reserves the next date tag on GitHub, gives the images
# that tag, and publishes the release. All of that happens before production
# changes, so a GitHub outage fails the deploy instead of shipping a build that
# GitHub has no tag for. `latest`, which production's compose file pulls, moves
# last, and only to images built from the commit the release tag points at.
#
# The docs site in apps/docs is part of the compose stack too. Every release
# builds its image, `stagecodes/otr-docs`, alongside the web and data worker
# images, and production serves it on port 8090.
#
# The rating processor is not part of the compose stack. A weekly cron outside
# this repository runs whatever `stagecodes/otr-processor:latest` is. A release
# builds a new processor image only when apps/processor changed since the
# previous release, and gives it the release tag. Otherwise the release keeps
# the image the previous release ran. Either way, its notes name the image on a
# `Processor image:` line, described in .github/scripts/release-notes.ts. The
# next release reads that line to find the image it keeps, and a redeploy reads
# it to point `latest` back at the release's image. A processor version tag is
# written once and never again, because otr-replay takes the time it was pushed
# as the time its release became usable. Only `latest` moves: after the rest of
# the stack is up, and only to an image built from the commit its tag points at.
#
# The operations scripts in apps/scripts, which run the weekly processor and
# the database archives and recoveries, are not an image. Every release copies
# them to the host at <REMOTE_PATH>/apps/scripts, with the production
# environment's SCRIPTS_ENV secret as their .env, once the stack is up. A
# redeploy installs the release's copy, so it rolls the scripts back too.
#
# Prometheus evaluates the rules in monitoring/prod/prometheus/rules and
# Alertmanager sends what fires to Discord, through the webhook in the ENV
# secret's DISCORD_WEBHOOK_URL. The scripts' cron runs reach those rules
# through node-exporter's textfile collector, in <REMOTE_PATH>/textfile-collector,
# once SCRIPTS_ENV sets METRICS_DIR to that directory and the crontab runs the
# copy at <REMOTE_PATH>/apps/scripts.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to redeploy, e.g. 2026.10.03'
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      new: ${{ steps.resolve.outputs.new }}
      # The previous release, for a new release only.
      previous: ${{ steps.processor.outputs.previous }}
      # 'true' when this run builds a processor image.
      processor-build: ${{ steps.processor.outputs.build }}
      # The tag of the processor image the release runs, when it already
      # exists: the image a new release keeps, or the one a redeployed release
      # names. Empty when this run builds one, because the release tag that
      # image will get is not reserved yet.
      processor-tag: ${{ steps.processor.outputs.tag }}
    steps:
      - name: Resolve tag and source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] ||
              ! gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
              echo "::error::No release is tagged '$INPUT_TAG'." >&2
              exit 1
            fi

            {
              echo "tag=$INPUT_TAG"
              echo "ref=refs/tags/$INPUT_TAG"
              echo "new=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The release job picks the tag once CI has passed.
          {
            echo "ref=$SHA"
            echo "new=true"
          } >> "$GITHUB_OUTPUT"

      # The commit this workflow runs from, for its copy of the release notes
      # script. On a push it is also the commit being released.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # Decides whether this run builds a processor image and, when it does
      # not, which existing image the release runs.
      #
      # A new release builds one when a file under apps/processor/ differs
      # between the previous release and this commit. It also builds one when
      # the previous release's notes name no processor image, which is true of
      # every release made before the notes carried that line. Otherwise it
      # keeps the image the previous release names. Comparing with the previous
      # release, rather than with the commit before this push, counts changes
      # from runs that failed or were cancelled before they released anything.
      #
      # A redeploy builds nothing and runs the image its release names. A
      # release made before the line existed names none, and then the deploy
      # leaves the processor alone.
      - name: Choose processor image
        id: processor
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.resolve.outputs.new }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail

          # Each lookup is one pipeline, so with pipefail a failed GitHub call
          # fails the step instead of reading as a release that names no image.
          if [[ "$NEW" != "true" ]]; then
            tag="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
              bun .github/scripts/release-notes.ts processor-tag)"
            if [[ -n "$tag" ]]; then
              echo "Release $TAG runs stagecodes/otr-processor:$tag."
            else
              echo "::warning::Release $TAG names no processor image, so stagecodes/otr-processor:latest stays where it is."
            fi
            {
              echo "build=false"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same baseline the release notes use, which the release job
          # passes on to them.
          previous="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          kept="$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            bun .github/scripts/release-notes.ts processor-tag)"

          # The comparison reads only the two commits' file trees, so one commit
          # of history from the previous release is enough. --no-renames lists
          # a moved file under its old and new paths, so a file moved out of
          # apps/processor/ still counts.
          git fetch --quiet --depth=1 --no-tags origin "refs/tags/$previous:refs/tags/$previous"
          changed="$(git diff --name-only --no-renames "refs/tags/$previous" "$SHA" -- apps/processor)"

          if [[ -z "$kept" ]]; then
            echo "Release $previous names no processor image, so this release builds one."
            build=true
          elif [[ -n "$changed" ]]; then
            echo "apps/processor changed since $previous, so this release builds a processor image:"
            echo "$changed"
            build=true
            kept=
          else
            echo "apps/processor is unchanged since $previous, so this release keeps stagecodes/otr-processor:$kept."
            build=false
          fi

          {
            echo "previous=$previous"
            echo "build=$build"
            echo "tag=$kept"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      build: false
    # A called workflow sees only the secrets passed to it. CI signs in to
    # Docker Hub with these before pulling images.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build:
    name: Build & push Docker images
    needs: resolve
    if: needs.resolve.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      web: ${{ steps.web.outputs.digest }}
      data-worker: ${{ steps.data-worker.outputs.digest }}
      docs: ${{ steps.docs.outputs.digest }}
      # Empty when this run does not build a processor image.
      processor: ${{ steps.processor.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The provenance records the commit, which the deploy checks against the
      # release tag.
      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: mode=max
          tags: stagecodes/otr-web:sha-${{ needs.resolve.outputs.ref }}
          build-args: OTR_BUILD_ID=${{ needs.resolve.outputs.ref }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      - name: Build and push data worker image
        id: data-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/data-worker/Dockerfile
          push: true
          provenance: mode=max
          tags: stagecodes/otr-data-worker:sha-${{ needs.resolve.outputs.ref }}
          cache-from: type=gha,scope=data-worker
          cache-to: type=gha,scope=data-worker,mode=max,ignore-error=true

      - name: Build and push docs image
        id: docs
        uses: docker/build-push-action@v6
        with:
          context: apps/docs
          file: apps/docs/Dockerfile
          push: true
          provenance: mode=max
          tags: stagecodes/otr-docs:sha-${{ needs.resolve.outputs.ref }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max,ignore-error=true

      # Only when the resolve job chose to build one.
      - name: Build and push processor image
        id: processor
        if: needs.resolve.outputs.processor-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/processor
          file: apps/processor/Dockerfile
          push: true
          provenance: mode=max
          tags: stagecodes/otr-processor:sha-${{ needs.resolve.outputs.ref }}
          cache-from: type=gha,scope=processor
          cache-to: type=gha,scope=processor,mode=max,ignore-error=true

  release:
    name: Publish release
    needs: [resolve, checks, build]
    if: needs.resolve.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.reserve.outputs.tag }}
      processor-tag: ${{ steps.processor.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Reserve release tag
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail

          # The first release of a day is YYYY.MM.DD, later ones add .1, .2, ...
          day="$(date -u +%Y.%m.%d)"
          # Captured first: a failed lookup inside the loop's process
          # substitution went unnoticed and reused an existing tag.
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$day" \
            --jq '.[] | [.ref, .object.sha] | @tsv')"
          last=-1
          tag=
          while IFS=$'\t' read -r ref sha; do
            name="${ref#refs/tags/}"
            if [[ "$name" == "$day" ]]; then
              n=0
            elif [[ "$name" =~ ^${day//./\\.}\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            else
              continue
            fi
            if (( n > last )); then last="$n"; fi
            # A re-run keeps the tag it already reserved for this commit.
            if [[ "$sha" == "$SHA" ]]; then tag="$name"; fi
          done <<< "$refs"

          if [[ -z "$tag" ]]; then
            if (( last < 0 )); then tag="$day"; else tag="$day.$(( last + 1 ))"; fi
            # Creating a tag that already exists fails, so a stale lookup
            # cannot hand out a tag twice.
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$SHA" >/dev/null
          fi

          echo "Releasing $SHA as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A processor image built by this run takes the release tag just
      # reserved. Otherwise the release keeps the image the resolve job found.
      - name: Choose processor tag
        id: processor
        env:
          BUILD: ${{ needs.resolve.outputs.processor-build }}
          TAG: ${{ steps.reserve.outputs.tag }}
          KEPT: ${{ needs.resolve.outputs.processor-tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD" == "true" ]]; then tag="$TAG"; else tag="$KEPT"; fi
          if [[ -z "$tag" ]]; then
            echo "::error::No processor image was built or kept for $TAG." >&2
            exit 1
          fi
          echo "Release $TAG runs stagecodes/otr-processor:$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Runs after the tag is reserved because the processor line can name the
      # new tag. A failure here leaves the tag reserved for this commit, and a
      # re-run reuses it.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.ref }}
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous }}
          PROCESSOR_TAG: ${{ steps.processor.outputs.tag }}
          PROCESSOR_BUILT: ${{ needs.resolve.outputs.processor-build }}
        run: bun .github/scripts/release-notes.ts render > release-notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # By digest, so the tag lands on exactly the images this run built.
      - name: Tag images with the release
        env:
          TAG: ${{ steps.reserve.outputs.tag }}
          WEB: stagecodes/otr-web@${{ needs.build.outputs.web }}
          DATA_WORKER: stagecodes/otr-data-worker@${{ needs.build.outputs.data-worker }}
          DOCS: stagecodes/otr-docs@${{ needs.build.outputs.docs }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "stagecodes/otr-web:$TAG" "$WEB"
          docker buildx imagetools create --tag "stagecodes/otr-data-worker:$TAG" "$DATA_WORKER"
          docker buildx imagetools create --tag "stagecodes/otr-docs:$TAG" "$DOCS"

      # Writes the processor's version tag once. Writing it again would move
      # its push time on Docker Hub, which otr-replay reads as the time the
      # release became usable. A re-run can find the tag already written by an
      # earlier attempt: it is kept when it names the image this run built, or
      # another image built from the same commit, as when every job re-ran and
      # rebuilt it. A tag on an image from any other commit stops the release.
      - name: Tag processor image with the release
        if: needs.resolve.outputs.processor-build == 'true'
        env:
          TAG: ${{ steps.reserve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.ref }}
          DIGEST: ${{ needs.build.outputs.processor }}
        run: |
          set -euo pipefail
          image=stagecodes/otr-processor

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build job reported no processor image digest." >&2
            exit 1
          fi

          # A missing tag is the one failure that means "not written yet".
          errors="$(mktemp)"
          if ! manifest="$(docker buildx imagetools inspect "$image:$TAG" \
            --format '{{json .Manifest}}' 2>"$errors")"; then
            if ! grep -q ': not found' "$errors"; then
              cat "$errors" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$image:$TAG" "$image@$DIGEST"
            exit 0
          fi

          existing="$(jq -r .digest <<<"$manifest")"
          if [[ "$existing" == "$DIGEST" ]]; then
            echo "$image:$TAG already names $DIGEST."
            exit 0
          fi
          # Older images carry SLSA v0.2 provenance, newer ones v1.
          built="$(docker buildx imagetools inspect "$image@$existing" \
            --format '{{json .Provenance}}' | jq -r '
              .SLSA.runDetails.metadata.buildkit_metadata.vcs.revision //
              .SLSA.metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision //
              empty')"
          if [[ "$built" != "$SHA" ]]; then
            echo "::error::$image:$TAG already names $existing, built from ${built:-an unrecorded commit}, not $SHA. It is never rewritten." >&2
            exit 1
          fi
          echo "$image:$TAG already names $existing, an earlier build of $SHA, so it is kept."

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.reserve.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release-notes.md --latest

  deploy:
    name: Deploy to production
    needs: [resolve, release]
    # A redeploy skips CI, the build, and the release; a new release needs all
    # three to pass.
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success' &&
      (needs.resolve.outputs.new != 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          sparse-checkout: |
            docker-compose.yml
            monitoring
            apps/scripts

      # The installer comes from the commit this workflow runs from, because an
      # older release being redeployed may not have it.
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          path: .workflow
          sparse-checkout: .github/scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # An image whose provenance does not name the release's commit, such as
      # one pushed by hand, is refused. A processor image kept from an earlier
      # release must name that release's commit instead.
      - name: Verify release images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ needs.resolve.outputs.new }}
          TAG: ${{ needs.resolve.outputs.tag || needs.release.outputs.tag }}
          # The release job's choice for a new release; on a redeploy, which
          # skips that job, the image the redeployed release names.
          PROCESSOR_TAG: ${{ needs.release.outputs.processor-tag || needs.resolve.outputs.processor-tag }}
        run: |
          set -euo pipefail

          # Checks that stagecodes/$1:$2 was built from commit $3, then records
          # the image by digest for the steps that move `latest`.
          verify() {
            local image="$1" tag="$2" commit="$3" digest built
            digest="$(docker buildx imagetools inspect "stagecodes/$image:$tag" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::stagecodes/$image:$tag has no image digest." >&2
              exit 1
            fi
            # Older images carry SLSA v0.2 provenance, newer ones v1.
            built="$(docker buildx imagetools inspect "stagecodes/$image@$digest" \
              --format '{{json .Provenance}}' | jq -r '
                .SLSA.runDetails.metadata.buildkit_metadata.vcs.revision //
                .SLSA.metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision //
                empty')"
            if [[ "$built" != "$commit" ]]; then
              echo "::error::stagecodes/$image:$tag was built from ${built:-an unrecorded commit}, not $tag ($commit)." >&2
              exit 1
            fi
            echo "$image=stagecodes/$image@$digest" >> "$GITHUB_OUTPUT"
          }

          commit="$(git rev-parse HEAD)"
          verify otr-web "$TAG" "$commit"
          verify otr-data-worker "$TAG" "$commit"

          # Releases made before the docs moved into this repository have no
          # docs image. A redeploy of one leaves stagecodes/otr-docs:latest
          # where it is, and its compose file has no docs service, so compose
          # removes the docs container.
          errors="$(mktemp)"
          if [[ "$NEW" == "true" ]] ||
            docker buildx imagetools inspect "stagecodes/otr-docs:$TAG" >/dev/null 2>"$errors"; then
            verify otr-docs "$TAG" "$commit"
          elif grep -q ': not found' "$errors"; then
            echo "::warning::Release $TAG has no docs image, so stagecodes/otr-docs:latest stays where it is."
          else
            cat "$errors" >&2
            exit 1
          fi

          if [[ -z "$PROCESSOR_TAG" ]]; then
            # Only a redeploy of a release made before the processor line
            # existed gets here; a new release always names an image.
            if [[ "$NEW" == "true" ]]; then
              echo "::error::Release $TAG names no processor image." >&2
              exit 1
            fi
            echo "::warning::Release $TAG names no processor image, so stagecodes/otr-processor:latest stays where it is."
          elif [[ "$PROCESSOR_TAG" == "$TAG" ]]; then
            verify otr-processor "$PROCESSOR_TAG" "$commit"
          else
            # The commit the older release's tag points at. An annotated tag
            # points at a tag object, which is followed to its commit.
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PROCESSOR_TAG" \
              --jq '.object.type + " " + .object.sha')"
            read -r type sha <<<"$object"
            while [[ "$type" == "tag" ]]; do
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" \
                --jq '.object.type + " " + .object.sha')"
              read -r type sha <<<"$object"
            done
            if [[ "$type" != "commit" ]]; then
              echo "::error::Tag $PROCESSOR_TAG does not point at a commit." >&2
              exit 1
            fi
            verify otr-processor "$PROCESSOR_TAG" "$sha"
          fi

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Ensure remote directory exists
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          # node-exporter reads textfile-collector, where the operations scripts
          # record their cron runs. Made here, before compose would create it
          # owned by root, so the scripts' user can write to it.
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
            mkdir -p "$1/textfile-collector"
          EOF

      - name: Upload deployment assets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENV_CONTENT" > .env
          scp -o StrictHostKeyChecking=no -r .env docker-compose.yml monitoring \
          "$SSH_USER@$SSH_HOST:$REMOTE_PATH/"

      # Moved only once the host is reachable, so an unreachable host leaves
      # `latest` where production is.
      - name: Point latest at the release images
        env:
          WEB: ${{ steps.images.outputs.otr-web }}
          DATA_WORKER: ${{ steps.images.outputs.otr-data-worker }}
          # Empty only on a redeploy of a release that has no docs image.
          DOCS: ${{ steps.images.outputs.otr-docs }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag stagecodes/otr-web:latest "$WEB"
          docker buildx imagetools create --tag stagecodes/otr-data-worker:latest "$DATA_WORKER"
          if [[ -n "$DOCS" ]]; then
            docker buildx imagetools create --tag stagecodes/otr-docs:latest "$DOCS"
          fi

      - name: Deploy stack via docker compose
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -s -- "$REMOTE_PATH" <<'EOF'
            cd "$1"
            docker compose pull
            # compose run attaches stdin, which is this script, so without
            # </dev/null it consumes the lines below and they never run.
            docker compose --profile migrate run --rm -T migrate </dev/null || exit
            # One-time move of the docs into the stack: otr-docs' own deploy
            # ran an `otr-docs` container outside compose, which holds the
            # name and port compose's docs service needs. Remove this once a
            # release has deployed the docs service.
            if labels="$(docker container inspect -f '{{ json .Config.Labels }}' otr-docs 2>/dev/null)" &&
              [[ "$labels" != *com.docker.compose.project* ]]; then
              docker rm -f otr-docs
            fi
            docker compose --profile node-exporter up -d --remove-orphans
          EOF

      # Before the processor's `latest` moves, so a failed install leaves the
      # weekly run with the scripts and the image of the previous release.
      - name: Install the operations scripts
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          SCRIPTS_ENV: ${{ secrets.SCRIPTS_ENV }}
          TAG: ${{ needs.resolve.outputs.tag || needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a redeploy of a release made before the scripts moved into
          # this repository gets here.
          if [[ ! -d apps/scripts ]]; then
            echo "::warning::Release $TAG has no apps/scripts, so the host keeps the scripts it has."
            exit 0
          fi
          bash .workflow/.github/scripts/deploy-ops-scripts.sh apps/scripts \
            "$SSH_USER@$SSH_HOST" "$REMOTE_PATH"

      # Moved after the stack is up, so the weekly run never pairs a new
      # processor with a database whose migration failed. Only `latest` is
      # written; the image keeps its version tag as it is.
      - name: Point the processor's latest at the release image
        if: steps.images.outputs.otr-processor != ''
        env:
          PROCESSOR: ${{ steps.images.outputs.otr-processor }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag stagecodes/otr-processor:latest "${PROCESSOR:?}"
