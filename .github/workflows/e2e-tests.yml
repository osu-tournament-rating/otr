name: E2E Tests

# Nightly on master, and by hand on any branch: spins up Postgres + RabbitMQ
# in the runner, restores the redacted dev archive via apps/scripts, and runs
# playwright. PR previews and the dev tier restore the same archive.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Match docker-compose.yml so the otr-db container name and creds
      # line up with what apps/scripts expects via DB_CONTAINER/DB_USER/DB_NAME.
      DOCKER_POSTGRES_USER: postgres
      DOCKER_POSTGRES_PASSWORD: password
      DOCKER_POSTGRES_DB: postgres
      DOCKER_RABBITMQ_USER: admin
      DOCKER_RABBITMQ_PASSWORD: admin
      DOCKER_DATABASE_URL: postgresql://postgres:password@db:5432/postgres
      DOCKER_RABBITMQ_AMQP_URL: amqp://admin:admin@rabbitmq:5672/

      # Host-side connection strings for migrations + Playwright web server.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres
      RABBITMQ_AMQP_URL: amqp://admin:admin@localhost:5672/

      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3001
      BETTER_AUTH_SECRET: e2e-test-secret
      BETTER_AUTH_URL: http://localhost:3001

      # Staging dir for apps/scripts. Holds a stripped compose file that
      # only declares db + rabbitmq, so the recovery script's
      # `docker compose down` / `up -d` cycle doesn't try to start web
      # and data-worker (Playwright launches its own web on 3001).
      OTR_COMPOSE_DIR: ${{ github.workspace }}/.e2e-compose

      # Secrets cannot appear in `if:`, so the Docker Hub sign-in checks this.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout otr
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Install otr dependencies
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'

      - name: Install apps/scripts dependencies
        working-directory: apps/scripts
        run: uv sync --locked

      - name: Write GCS service account key
        run: |
          mkdir -p "${HOME}/.gcs"
          printf '%s' '${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}' > "${HOME}/.gcs/sa.json"
          chmod 600 "${HOME}/.gcs/sa.json"

      - name: Stage minimal compose for apps/scripts
        # The recovery script runs `docker compose down/up` in OTR_WEB_DIR.
        # Point it at this dir which only declares the two services we
        # actually need for E2E. Recovery also runs the `migrate` service
        # after restoring, and fails without one. Here it does nothing:
        # the "Run database migrations" step below applies this checkout's
        # migrations instead of the deployed image's.
        run: |
          mkdir -p "${OTR_COMPOSE_DIR}"
          cat > "${OTR_COMPOSE_DIR}/docker-compose.yml" <<'YAML'
          services:
            db:
              image: postgres:17
              container_name: otr-db
              shm_size: '256m'
              ports:
                - '5432:5432'
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: password
                POSTGRES_DB: postgres
              healthcheck:
                test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
                interval: 5s
                timeout: 5s
                retries: 20
                start_period: 5s
            rabbitmq:
              image: rabbitmq:4-management
              container_name: otr-rabbitmq
              ports:
                - '5672:5672'
                - '15672:15672'
              environment:
                RABBITMQ_DEFAULT_USER: admin
                RABBITMQ_DEFAULT_PASS: admin
              healthcheck:
                test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
                interval: 10s
                timeout: 5s
                retries: 12
            migrate:
              image: postgres:17
              profiles:
                - migrate
              command: ['true']
          YAML

      - name: Write apps/scripts .env
        working-directory: apps/scripts
        run: |
          cat > .env <<EOF
          ENVIRONMENT=dev
          TAG=latest
          DUMP_DIR=/tmp/otr-dumps
          PUBLIC_HTML_DIR=/tmp/otr-public-html
          OTR_WEB_DIR=${OTR_COMPOSE_DIR}
          DB_PORT=5432
          DB_CONTAINER=otr-db
          DB_USER=postgres
          DB_NAME=postgres
          DB_PASSWORD=password
          GCS_TEST_BUCKET=otr-test
          GCS_DEV_BUCKET=otr-dev-replica
          GCS_PUBLIC_BUCKET=otr-public-replica
          GCS_PROD_BUCKET=otr-prod-dumps
          GCS_SA_JSON_PATH=${HOME}/.gcs/sa.json
          RABBITMQ_URL=amqp://admin:admin@localhost:5672/
          EOF

      # The recovery script starts the compose file above, which pulls
      # PostgreSQL and RabbitMQ from Docker Hub. Signed in, the pulls count
      # against the account's quota rather than the runner's shared anonymous
      # limit.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore dev archive via apps/scripts
        working-directory: apps/scripts
        run: uv run python src/main.py -s recovery --recovery-bucket dev

      - name: Wait for db healthy
        run: |
          for i in {1..40}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' otr-db 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "db healthy"; exit 0
            fi
            echo "db: $status"; sleep 3
          done
          docker logs otr-db
          exit 1

      - name: Run database migrations
        run: bunx drizzle-kit migrate

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: bun run test:e2e
        working-directory: apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 3

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-traces
          path: apps/web/test-results/
          retention-days: 3

      - name: Tear down containers
        if: always()
        working-directory: ${{ env.OTR_COMPOSE_DIR }}
        run: docker compose down -v
