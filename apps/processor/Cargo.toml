[package]
name = "otr-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "otr_processor"
path = "src/lib.rs"

[[bin]]
name = "otr-processor"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15.7"
indicatif = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
chrono = {  version = "0.4.45", features = ["serde"] }
openskill = "0.0.1"
serde_repr = "0.1.21"
itertools = "0.15.0"
indexmap = "2.14.2"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
rand_chacha = "0.10.0"
rand = "0.10.3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-indicatif = "0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
uuid = { version = "1.28", features = ["v4"] }

[dev-dependencies]
approx = "0.5.1"
serde_json = "1.0.154"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
serial_test = "4.0"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"

[profile.release]
debug = "line-tables-only"
