<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IconButton</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      function Caption(props) {
        return h('span', { className: O.typeScale.meta }, props.children);
      }
      function Group(props) {
        return h(
          'div',
          { className: 'flex flex-col gap-2' },
          h('div', { className: 'flex items-center gap-2' }, props.children),
          h(Caption, null, props.caption)
        );
      }
      function Disclosure() {
        var s = React.useState(true),
          open = s[0],
          setOpen = s[1];
        var name = 'Hidden Chamber [Insane]';
        return h(
          O.Panel,
          null,
          h(O.SectionHeader, {
            icon: I.Swords,
            title: 'Games',
            meta: '1 game',
          }),
          h(
            O.RowList,
            null,
            h(
              O.RowListItem,
              null,
              h(
                'div',
                { className: 'flex items-center gap-3' },
                h(
                  'div',
                  { className: 'min-w-0 flex-1' },
                  h('p', { className: 'truncate font-medium' }, name),
                  h(
                    'p',
                    { className: O.typeScale.bodyMuted },
                    'Team Vs · HR · 3:12'
                  )
                ),
                h(O.IconButton, {
                  label: 'Details for ' + name,
                  icon: I.ChevronDown,
                  expanded: open,
                  onClick: function () {
                    setOpen(!open);
                  },
                  className:
                    '[&>svg]:transition-transform aria-expanded:[&>svg]:rotate-180',
                })
              ),
              open
                ? h(
                    'p',
                    {
                      className: O.typeScale.bodyMuted + ' mt-3 border-t pt-3',
                    },
                    'Expanded in place: the toggle keeps its resting look.'
                  )
                : null
            )
          )
        );
      }
      function Demo() {
        var sort = {
          variant: 'outline',
          label: 'Sort order is descending',
          tooltip: 'Descending order',
          icon: I.ArrowDownWideNarrow,
        };
        return h(
          'div',
          { className: 'flex flex-col gap-5' },
          h(
            'div',
            { className: 'grid grid-cols-2 gap-5' },
            h(
              Group,
              { caption: 'Ghost, the default: 32, 36 and 40px' },
              h(O.IconButton, {
                size: 'sm',
                label: 'View audit history',
                icon: I.History,
              }),
              h(O.IconButton, {
                size: 'default',
                label: 'View audit history',
                icon: I.History,
              }),
              h(O.IconButton, {
                size: 'lg',
                label: 'View audit history',
                icon: I.History,
              })
            ),
            h(
              Group,
              { caption: 'Outline, beside inputs' },
              h(O.IconButton, Object.assign({ size: 'sm' }, sort)),
              h(O.IconButton, Object.assign({ size: 'default' }, sort)),
              h(O.IconButton, Object.assign({ size: 'lg' }, sort))
            ),
            h(
              Group,
              { caption: 'Destructive, outside a menu' },
              h(O.IconButton, {
                label: 'Delete note',
                icon: I.Trash2,
                destructive: true,
              })
            ),
            h(
              Group,
              { caption: 'Drawn on a link' },
              h(
                O.IconButton,
                {
                  asChild: true,
                  label: 'View on osu!',
                  icon: I.ExternalLink,
                },
                h('a', {
                  href: 'https://osu.ppy.sh/beatmaps/1872396',
                  target: '_blank',
                  rel: 'noopener noreferrer',
                })
              )
            )
          ),
          h(Disclosure)
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
