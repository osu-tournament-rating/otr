<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Heatmap</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement,
        F = O.format;
      var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      var HOURS = [];
      for (var i = 0; i < 24; i++) HOURS.push(i);
      function hour(value) {
        var text = String(value % 24);
        return (text.length < 2 ? '0' + text : text) + ':00';
      }
      // Matches by weekday and UTC hour: weekends and afternoons, as on the
      // stats page.
      var VALUES = DAYS.map(function (_, day) {
        return HOURS.map(function (value) {
          var afternoon = Math.max(0, 6 - Math.abs(value - 15));
          return Math.round((day >= 5 ? 700 : 60) * (afternoon + 1) * 0.25);
        });
      });
      var TOTAL = VALUES.reduce(function (sum, row) {
        return (
          sum +
          row.reduce(function (rowSum, value) {
            return rowSum + value;
          }, 0)
        );
      }, 0);
      function Demo() {
        return h(
          O.Panel,
          null,
          h(O.SectionHeader, {
            icon: I.CalendarClock,
            title: 'When matches are played',
            level: 4,
            meta: F.formatCount(TOTAL) + ' matches',
          }),
          h(
            O.PanelBody,
            null,
            h(O.Heatmap, {
              'aria-label': 'When matches are played',
              rows: DAYS.map(function (day) {
                return { key: day, label: day };
              }),
              columns: HOURS.map(function (value) {
                return { key: String(value), label: hour(value) };
              }),
              values: VALUES,
              columnTicks: ['0', '5', '10', '15', '20'],
              valueName: 'Matches',
              cellTitle: function (row, column) {
                return (
                  row.label +
                  ', ' +
                  column.label +
                  '–' +
                  hour(Number(column.key) + 1) +
                  ' UTC'
                );
              },
              footer: function (value) {
                return F.formatPercent(value / TOTAL) + ' of matches';
              },
            })
          )
        );
      }
      function mount() {
        ReactDOM.createRoot(document.getElementById('root')).render(
          h(O.TooltipProvider, null, h(Demo))
        );
      }
      document.fonts && document.fonts.load
        ? document.fonts.load('12px Inter').then(mount, mount)
        : mount();
    </script>
  </body>
</html>
