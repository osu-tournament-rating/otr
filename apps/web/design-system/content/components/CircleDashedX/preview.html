<!-- @dsCard group="Status" height=140 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CircleDashedX</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement,
        VS = O.osu.VerificationStatus;
      function Row(label, children) {
        return h(
          'div',
          { className: 'flex items-center gap-3' },
          h(
            'span',
            { className: 'w-24 shrink-0 text-xs text-muted-foreground' },
            label
          ),
          h(
            'div',
            { className: 'flex min-w-0 flex-1 flex-wrap items-center gap-3' },
            children
          )
        );
      }
      function Demo() {
        return h(
          'div',
          { className: 'flex flex-col gap-4' },
          Row(
            'Pre-rejected',
            ['size-3.5', 'size-4', 'size-5', 'size-6'].map(function (s) {
              return h(O.CircleDashedX, {
                key: s,
                className: s + ' text-verification-rejected',
                'aria-hidden': 'true',
              });
            })
          ),
          Row(
            'Text colour',
            ['size-4', 'size-6'].map(function (s) {
              return h(O.CircleDashedX, {
                key: s,
                className: s,
                'aria-hidden': 'true',
              });
            })
          ),
          // Beside the lucide glyphs it is drawn from, as VerificationStatusIcon uses it.
          Row(
            'In the family',
            [
              VS.Verified,
              VS.PreVerified,
              VS.None,
              VS.PreRejected,
              VS.Rejected,
            ].map(function (s) {
              return h(O.VerificationStatusGlyph, {
                key: s,
                status: s,
                className: 'size-5',
              });
            })
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
