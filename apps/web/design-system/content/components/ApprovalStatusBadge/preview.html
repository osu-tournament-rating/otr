<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ApprovalStatusBadge</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        h = React.createElement;
      var ORDER = O.status.APPROVAL_STATUS_ORDER;
      function Row(label, children) {
        return h(
          'div',
          { className: 'flex items-center gap-3' },
          h(
            'span',
            { className: 'w-24 shrink-0 text-xs text-muted-foreground' },
            label
          ),
          h(
            'div',
            { className: 'flex min-w-0 flex-1 flex-wrap items-center gap-2' },
            children
          )
        );
      }
      function Demo() {
        return h(
          'div',
          { className: 'flex flex-col gap-4' },
          Row(
            'States',
            ORDER.map(function (s) {
              return h(O.ApprovalStatusBadge, {
                key: s,
                status: s,
              });
            })
          ),
          Row(
            'Small',
            ORDER.map(function (s) {
              return h(O.ApprovalStatusBadge, {
                key: s,
                status: s,
                size: 'sm',
              });
            })
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
