<!-- @dsCard group="Status" height=360 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VerificationStatusIcon</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        h = React.createElement,
        VS = O.osu.VerificationStatus;
      var ORDER = O.status.VERIFICATION_STATUS_ORDER;
      var REVIEWER = 'apricot';
      var GAMES = [
        { status: VS.Verified },
        { status: VS.Verified },
        { status: VS.PreVerified, warnings: ['Beatmap only used once'] },
        { status: VS.Verified },
        {
          status: VS.Rejected,
          rejectionReasons: ['Beatmap not pooled'],
          reviewer: REVIEWER,
        },
        { status: VS.Verified },
        { status: VS.PreRejected, rejectionReasons: ['No valid scores'] },
      ];
      function Row(label, children) {
        return h(
          'div',
          { className: 'flex items-center gap-3' },
          h(
            'span',
            { className: 'w-24 shrink-0 text-xs text-muted-foreground' },
            label
          ),
          h(
            'div',
            { className: 'flex min-w-0 flex-1 flex-wrap items-center gap-2' },
            children
          )
        );
      }
      function Demo() {
        return h(
          'div',
          { className: 'flex flex-col gap-4' },
          Row(
            'In text (sm)',
            h(
              'p',
              { className: 'text-sm' },
              REVIEWER + ' verified ',
              h(O.VerificationStatusIcon, {
                status: VS.Verified,
                size: 'sm',
                reviewer: REVIEWER,
                tooltip: 'tap',
              }),
              ' Corsace Open 2025'
            )
          ),
          Row(
            'Rows (md)',
            h(
              'ul',
              { 'aria-label': 'Games', className: 'flex items-center gap-2' },
              GAMES.map(function (g, i) {
                return h(
                  'li',
                  { key: i, className: 'inline-flex' },
                  h(O.VerificationStatusIcon, {
                    status: g.status,
                    warnings: g.warnings,
                    rejectionReasons: g.rejectionReasons,
                    reviewer: g.reviewer,
                    context: 'Game ' + (i + 1),
                    tooltip: 'tap',
                  })
                );
              })
            )
          ),
          Row(
            'Headers (lg)',
            h(
              'span',
              { className: 'inline-flex items-center gap-2 font-semibold' },
              h(O.VerificationStatusIcon, {
                status: VS.PreVerified,
                size: 'lg',
                warnings: ['Low game count'],
                tooltip: 'tap',
              }),
              'CO25: (Mafumafu) vs (Rafis)'
            )
          ),
          Row(
            'All states',
            ORDER.map(function (s) {
              return h(O.VerificationStatusIcon, {
                key: s,
                status: s,
                tooltip: 'tap',
              });
            })
          ),
          Row(
            'Greyscale',
            h(
              'span',
              { className: 'flex items-center gap-2 grayscale' },
              ORDER.map(function (s) {
                return h(O.VerificationStatusIcon, {
                  key: s,
                  status: s,
                  tooltip: 'tap',
                });
              })
            )
          ),
          Row('Warnings', [
            h(O.VerificationStatusIcon, {
              key: 'a',
              status: VS.PreVerified,
              warnings: ['Low game count'],
              tooltip: 'tap',
            }),
            h(O.VerificationStatusIcon, {
              key: 'b',
              status: VS.Verified,
              warnings: ['Overlapping rosters found'],
              reviewer: REVIEWER,
              tooltip: 'tap',
            }),
          ]),
          // The game card header: cover art under its scrim, then a dark disc per icon.
          Row(
            'On cover art',
            h(
              'div',
              {
                className:
                  'relative flex h-16 w-full max-w-72 items-start overflow-hidden rounded-lg p-2',
              },
              h(O.BeatmapCover, {
                beatmapsetOsuId: null,
                alt: '',
                sizes: '288px',
                className: 'absolute inset-0',
              }),
              h('div', {
                className:
                  'absolute inset-0 bg-gradient-to-b from-black/40 via-black/50 to-black/70',
              }),
              h(
                'ul',
                {
                  'aria-label': 'Games',
                  className: 'dark relative flex items-center gap-2',
                },
                GAMES.slice(2, 7).map(function (g, i) {
                  return h(
                    'li',
                    { key: i, className: 'inline-flex' },
                    h(O.VerificationStatusIcon, {
                      status: g.status,
                      variant: 'overlay',
                      warnings: g.warnings,
                      rejectionReasons: g.rejectionReasons,
                      reviewer: g.reviewer,
                      context: 'Game ' + (i + 3),
                      tooltip: 'tap',
                    })
                  );
                })
              )
            )
          ),
          Row(
            'On white',
            h(
              'span',
              { className: 'flex items-center gap-2 rounded-lg bg-white p-2' },
              ORDER.map(function (s) {
                return h(O.VerificationStatusIcon, {
                  key: s,
                  status: s,
                  variant: 'overlay',
                  tooltip: 'tap',
                });
              })
            )
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
