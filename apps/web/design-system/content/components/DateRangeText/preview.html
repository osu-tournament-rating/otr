<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DateRangeText</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        h = React.createElement;
      function Example(p) {
        return h(
          'div',
          {
            className:
              'grid grid-cols-[9rem_minmax(0,1fr)] items-baseline gap-3',
          },
          h(
            'dt',
            { className: 'text-xs font-medium text-muted-foreground' },
            p.label
          ),
          h(
            'dd',
            { className: 'flex min-w-0 flex-col gap-0.5 text-sm' },
            h('span', { className: 'min-w-0' }, p.children),
            p.hint
              ? h(
                  'span',
                  { className: 'text-xs break-words text-muted-foreground' },
                  p.hint
                )
              : null
          )
        );
      }
      function Card() {
        return h(
          O.Panel,
          null,
          h(
            O.PanelBody,
            null,
            h.apply(
              null,
              ['dl', { className: 'flex flex-col gap-3' }].concat(
                [].slice.call(arguments)
              )
            )
          )
        );
      }
      var RANGES = [
        { label: 'Same year', start: '2024-07-20', end: '2024-08-03' },
        { label: 'Same month', start: '2024-07-20', end: '2024-07-27' },
        { label: 'One day', start: '2024-07-20', end: '2024-07-20' },
        { label: 'Across years', start: '2023-12-28', end: '2024-01-04' },
        { label: 'No end date', start: '2024-07-20', end: null },
        { label: 'No start date', start: null, end: '2024-08-03' },
        { label: 'No dates', start: null, end: null },
      ];
      function Demo() {
        return Card.apply(
          null,
          RANGES.map(function (r) {
            return h(
              Example,
              { key: r.label, label: r.label },
              h(O.DateRangeText, { start: r.start, end: r.end })
            );
          })
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
