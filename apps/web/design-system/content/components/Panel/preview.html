<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Panel</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      function Demo() {
        return h(
          O.Panel,
          null,
          h(O.SectionHeader, { icon: I.Gauge, title: 'Overview' }),
          h(
            O.PanelBody,
            { className: O.typeScale.bodyMuted },
            'Rows, tiles, a table or a chart'
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
