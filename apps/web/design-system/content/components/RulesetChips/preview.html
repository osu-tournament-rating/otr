<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RulesetChips</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        R = O.osu.Ruleset,
        h = React.createElement;
      function Chips(props) {
        var s = React.useState(props.initial),
          value = s[0],
          setValue = s[1];
        return h(O.RulesetChips, { value: value, onValueChange: setValue });
      }
      function Demo() {
        return h(
          'div',
          { className: 'flex flex-col gap-3' },
          h(Chips, { initial: [R.Osu] }),
          h(Chips, { initial: [] })
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
