<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DataTable</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        F = O.format,
        h = React.createElement;
      var HREF = '#tables-data-table';

      var LEADERBOARD = [
        {
          id: 1,
          rank: 1,
          name: 'mrekk',
          country: 'AU',
          countryName: 'Australia',
          tier: 'Elite Grandmaster',
          rating: 3121.4,
          tournaments: 58,
          matches: 1204,
          winRate: 0.724,
        },
        {
          id: 2,
          rank: 2,
          name: 'lifeline',
          country: 'US',
          countryName: 'United States',
          tier: 'Elite Grandmaster',
          rating: 3044.9,
          tournaments: 71,
          matches: 1388,
          winRate: 0.689,
        },
        {
          id: 3,
          rank: 3,
          name: 'Accolibed',
          country: 'KR',
          countryName: 'South Korea',
          tier: 'Grandmaster',
          subTier: 3,
          rating: 2912.2,
          tournaments: 44,
          matches: 902,
          winRate: 0.701,
        },
        {
          id: 4,
          rank: 4,
          name: 'Raikouhou',
          country: 'JP',
          countryName: 'Japan',
          tier: 'Grandmaster',
          subTier: 2,
          rating: 2734.6,
          tournaments: 39,
          matches: 655,
          winRate: null,
        },
        {
          id: 5,
          rank: 5,
          name: 'distantmemory',
          country: 'US',
          countryName: 'United States',
          tier: 'Grandmaster',
          subTier: 1,
          rating: 2615.3,
          tournaments: 52,
          matches: 1017,
          winRate: 0.642,
        },
        {
          id: 6,
          rank: 6,
          name: 'Yasui',
          country: 'JP',
          countryName: 'Japan',
          tier: 'Master',
          subTier: 3,
          rating: 2488.1,
          tournaments: 27,
          matches: 431,
          winRate: 0.598,
          you: true,
        },
      ];
      var PAGE_SIZE = 50,
        PLAYER_COUNT = 8412;
      var SORT_OPTIONS = [
        { value: 'rating', label: 'Rating' },
        { value: 'tournaments', label: 'Tournaments' },
        { value: 'matches', label: 'Matches' },
        { value: 'winRate', label: 'Win rate' },
      ];

      // Missing values sort last in both directions, as the site's sortRows does.
      function sortRows(rows, sort) {
        var sign = sort.direction === 'asc' ? 1 : -1;
        return rows
          .map(function (row, i) {
            return { row: row, i: i, v: row[sort.key] };
          })
          .sort(function (a, b) {
            var am = a.v === null,
              bm = b.v === null;
            if (am || bm) return am === bm ? a.i - b.i : am ? 1 : -1;
            return sign * (a.v === b.v ? 0 : a.v < b.v ? -1 : 1) || a.i - b.i;
          })
          .map(function (x) {
            return x.row;
          });
      }

      function PlayerAvatar(p) {
        return h(
          'span',
          {
            className:
              'relative flex shrink-0 overflow-hidden rounded-full ' +
              (p.large ? 'size-8' : 'size-6'),
          },
          h(
            'span',
            {
              className:
                'flex size-full items-center justify-center rounded-full bg-muted text-xs font-medium',
            },
            p.name.charAt(0).toUpperCase()
          )
        );
      }
      function TierMark(p) {
        return h(O.TierIcon, {
          tier: p.tier,
          subTier: p.subTier,
          tooltip: true,
          width: p.size || 20,
          height: p.size || 20,
        });
      }
      function PlayerName(p) {
        var row = p.row;
        return h(
          'span',
          { className: 'flex min-w-0 items-center gap-1.5' },
          h(
            O.EntityLink,
            {
              href: HREF,
              leading:
                p.avatar === false
                  ? undefined
                  : h(PlayerAvatar, { name: row.name }),
            },
            row.name
          ),
          h(O.CountryFlag, { code: row.country, name: row.countryName }),
          row.you ? h(O.Badge, { size: 'sm', tone: 'primary' }, 'You') : null
        );
      }
      function summary(row, key) {
        if (key === 'matches')
          return F.formatCountOf(row.matches, 'match', 'matches');
        var parts = [F.formatCountOf(row.tournaments, 'tournament')];
        if (row.winRate !== null)
          parts.push(F.formatPercent(row.winRate) + ' win rate');
        return parts.join(' · ');
      }

      function Demo() {
        var s = React.useState({ key: 'rating', direction: 'desc' }),
          sort = s[0],
          setSort = s[1];
        var pg = React.useState(1),
          page = pg[0],
          setPage = pg[1];
        var offset = (page - 1) * PAGE_SIZE;
        var rows = sortRows(LEADERBOARD, sort).map(function (row) {
          return Object.assign({}, row, { rank: row.rank + offset });
        });
        function sh(key, label, extra) {
          return h(
            O.SortableHeader,
            Object.assign(
              {
                sortKey: key,
                sort: sort,
                onSortChange: setSort,
                numeric: true,
              },
              extra
            ),
            label
          );
        }

        return h(
          O.Panel,
          null,
          h(O.SectionHeader, {
            icon: I.ListOrdered,
            title: 'Global leaderboard',
            meta: F.formatCount(PLAYER_COUNT) + ' players',
          }),
          h(
            O.DataTable,
            {
              'aria-label': 'Global leaderboard',
              phoneSort: h(O.SortControl, {
                size: 'sm',
                label: 'Sort players by',
                options: SORT_OPTIONS,
                value: sort,
                onValueChange: setSort,
              }),
              phoneRows: h(
                O.PhoneRowList,
                { as: 'ol', 'aria-label': 'Global leaderboard' },
                rows.map(function (row) {
                  return h(O.PhoneRow, {
                    key: row.id,
                    highlight: row.you,
                    rank: F.formatRank(row.rank),
                    leading: h(PlayerAvatar, { name: row.name, large: true }),
                    leadingHref: HREF,
                    title: h(PlayerName, { row: row, avatar: false }),
                    description: summary(row, sort.key),
                    valueAdornment: h(TierMark, {
                      tier: row.tier,
                      subTier: row.subTier,
                      size: 22,
                    }),
                    value: F.formatRating(row.rating),
                  });
                })
              ),
            },
            h(
              O.DataTableHeader,
              null,
              h(
                O.DataTableRow,
                null,
                h(O.DataTableHead, { className: 'w-16' }, 'Rank'),
                h(O.DataTableHead, null, 'Player'),
                sh('rating', 'Rating'),
                sh('tournaments', 'Tournaments'),
                sh('matches', 'Matches', { showFrom: 'lg' }),
                sh('winRate', 'Win rate')
              )
            ),
            h(
              O.DataTableBody,
              null,
              rows.map(function (row) {
                return h(
                  O.DataTableRow,
                  { key: row.id, highlight: row.you },
                  h(
                    O.DataTableCell,
                    { className: 'font-medium tabular-nums' },
                    F.formatRank(row.rank)
                  ),
                  h(O.DataTableCell, null, h(PlayerName, { row: row })),
                  h(
                    O.DataTableCell,
                    { numeric: true },
                    h(
                      'span',
                      {
                        className:
                          'flex items-center justify-end gap-1 font-semibold',
                      },
                      h(TierMark, { tier: row.tier, subTier: row.subTier }),
                      F.formatRating(row.rating)
                    )
                  ),
                  h(
                    O.DataTableCell,
                    { numeric: true },
                    F.formatCount(row.tournaments)
                  ),
                  h(
                    O.DataTableCell,
                    { numeric: true, showFrom: 'lg' },
                    F.formatCount(row.matches)
                  ),
                  h(
                    O.DataTableCell,
                    { numeric: true },
                    F.formatPercent(row.winRate)
                  )
                );
              })
            )
          ),
          h(O.PaginationFooter, {
            page: page,
            pageSize: PAGE_SIZE,
            totalCount: PLAYER_COUNT,
            onPageChange: setPage,
            label: 'Leaderboard pages',
          })
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
