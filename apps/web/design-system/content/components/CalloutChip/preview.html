<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CalloutChip</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      var TONES = [
        ['info', 'Info'],
        ['warning', 'Warning'],
        ['danger', 'Danger'],
      ];
      function Demo() {
        return h(
          O.Panel,
          null,
          h(O.SectionHeader, {
            icon: I.ChartNoAxesColumn,
            title: 'Tournament rank restrictions',
            actions: h(
              O.CalloutChip,
              { icon: I.ShieldQuestion },
              'Includes unverified'
            ),
          }),
          h(
            O.PanelBody,
            { className: 'flex flex-col gap-3' },
            h(
              'div',
              { className: 'flex flex-wrap items-center gap-2' },
              TONES.map(function (t) {
                return h(O.CalloutChip, { key: t[0], tone: t[0] }, t[1]);
              })
            ),
            h(
              'div',
              { className: 'flex flex-wrap items-center gap-2' },
              TONES.map(function (t) {
                return h(
                  O.CalloutChip,
                  { key: t[0], tone: t[0], size: 'sm' },
                  t[1]
                );
              })
            )
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
