<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tile</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      function Demo() {
        return h(
          'div',
          { className: 'grid gap-2 sm:grid-cols-2' },
          h(
            O.Tile,
            null,
            h(O.Eyebrow, { className: 'block' }, 'Most used in'),
            h(
              'a',
              {
                href: '#',
                className:
                  'mt-0.5 flex w-fit items-start gap-1 rounded-sm text-sm font-semibold hover:underline focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none',
              },
              'Break The Meta Cup',
              h(I.ArrowUpRight, {
                className: 'mt-0.5 size-3.5 shrink-0 text-muted-foreground',
                'aria-hidden': true,
              })
            ),
            h('p', { className: O.typeScale.meta }, '120 scores · 12 games')
          ),
          h(
            O.Tile,
            { asChild: true, interactive: true, className: 'relative' },
            h(
              'button',
              {
                type: 'button',
                'aria-label': 'Pooled in 62 tournaments, 54 of them verified',
              },
              h(
                O.Eyebrow,
                { className: 'flex items-center gap-1.5' },
                h(I.WavesLadder, {
                  className: 'size-3.5 shrink-0',
                  'aria-hidden': true,
                }),
                'Pooled in'
              ),
              h(
                'span',
                { className: 'mt-1 block text-xl leading-none font-bold' },
                '62'
              ),
              h(
                'span',
                {
                  className:
                    'mt-0.5 block text-xs leading-tight text-muted-foreground',
                },
                '54 verified'
              ),
              h(I.ChevronRight, {
                className:
                  'absolute top-2.5 right-3 size-3.5 translate-y-px text-muted-foreground',
                'aria-hidden': true,
              })
            )
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
