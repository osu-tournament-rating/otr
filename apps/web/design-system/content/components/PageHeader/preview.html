<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PageHeader</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      function Demo() {
        return h(
          'div',
          { className: 'flex flex-col gap-8' },
          h(O.PageHeader, {
            icon: I.Trophy,
            title: 'Tournaments',
            description:
              'Browse tournament submissions and their review status. Only verified data is included in ratings.',
            actions: h(O.Button, { icon: I.Upload }, 'Submit'),
          }),
          h(O.PageHeader, {
            icon: I.History,
            title: 'Break The Meta Cup',
            back: { href: '#', label: 'View tournament' },
          })
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
