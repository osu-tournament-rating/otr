<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HeroTabsRoot</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        I = O.Icons,
        h = React.createElement;
      function Demo() {
        return h(
          O.HeroTabsRoot,
          { defaultValue: 'games' },
          h(O.DetailHero, {
            title: 'BTMC: (distantmemory) vs (Raikouhou)',
            meta: h(
              React.Fragment,
              null,
              h(O.HeroMetaItem, { icon: I.Trophy }, 'Break The Meta Cup'),
              h(
                O.HeroMetaItem,
                { icon: I.CalendarDays },
                'Dec 18, 2021, 19:02 UTC'
              )
            ),
            tabs: h(
              O.HeroTabsList,
              { 'aria-label': 'Match views' },
              h(O.HeroTabsTrigger, { value: 'games', count: '9' }, 'Games'),
              h(O.HeroTabsTrigger, { value: 'stats' }, 'Stats')
            ),
          }),
          h(
            O.HeroTabsContent,
            { value: 'games' },
            h(
              O.Panel,
              null,
              h(O.SectionHeader, {
                icon: I.Swords,
                title: 'Games',
                meta: '9 games',
              }),
              h(O.PanelBody, { className: O.typeScale.bodyMuted }, 'Rows')
            )
          ),
          h(
            O.HeroTabsContent,
            { value: 'stats' },
            h(
              O.Panel,
              null,
              h(O.SectionHeader, {
                icon: I.ChartLine,
                title: 'Match statistics',
              }),
              h(O.PanelBody, { className: O.typeScale.bodyMuted }, 'Tiles')
            )
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
