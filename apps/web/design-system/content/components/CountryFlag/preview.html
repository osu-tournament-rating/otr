<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CountryFlag</title>
  </head>
  <body class="p-4">
    <div id="root"></div>
    <script>
      var O = window.OTR,
        h = React.createElement;
      var CODES = ['AU', 'KR', 'JP', 'US', 'PL', 'BR', 'XX'];
      function Example(p) {
        return h(
          'div',
          {
            className:
              'grid grid-cols-[9rem_minmax(0,1fr)] items-baseline gap-3',
          },
          h(
            'dt',
            { className: 'text-xs font-medium text-muted-foreground' },
            p.label
          ),
          h(
            'dd',
            { className: 'flex min-w-0 flex-col gap-0.5 text-sm' },
            h('span', { className: 'min-w-0' }, p.children),
            p.hint
              ? h(
                  'span',
                  { className: 'text-xs break-words text-muted-foreground' },
                  p.hint
                )
              : null
          )
        );
      }
      function Demo() {
        return h(
          O.Panel,
          null,
          h(
            O.PanelBody,
            null,
            h(
              'dl',
              { className: 'flex flex-col gap-3' },
              h(
                Example,
                { label: 'Name on tap' },
                h(
                  'span',
                  { className: 'flex flex-wrap items-center gap-3' },
                  CODES.map(function (c) {
                    return h(O.CountryFlag, { key: c, code: c });
                  })
                )
              ),
              h(
                Example,
                { label: 'Sizes', hint: 'sm 16×11, md 21×14' },
                h(
                  'span',
                  { className: 'flex items-center gap-3' },
                  h(O.CountryFlag, { code: 'NO', size: 'sm' }),
                  h(O.CountryFlag, { code: 'NO', size: 'md' })
                )
              ),
              h(
                Example,
                { label: 'In a row', hint: 'decorative: the link names it' },
                h(
                  'a',
                  {
                    href: '#',
                    'aria-label': '#12 in South Korea',
                    className:
                      'inline-flex items-center gap-1.5 rounded-sm text-xs font-medium text-muted-foreground tabular-nums transition-colors hover:text-foreground',
                  },
                  h(O.CountryFlag, { code: 'KR', decorative: true }),
                  h('span', { 'aria-hidden': 'true' }, '#12')
                )
              ),
              h(Example, { label: 'Profile' }, h(O.CountryName, { code: 'AU' }))
            )
          )
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(O.TooltipProvider, null, h(Demo))
      );
    </script>
  </body>
</html>
