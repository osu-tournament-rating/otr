services:
  db:
    image: postgres:17
    container_name: otr-db
    restart: unless-stopped
    # shm_size addresses an issue with running end-to-end tests.
    # The e2e suite hits the database in parallel,
    # without this option, the database is starved of
    # shared memory and produces errors.
    # This was seen in production as well.
    shm_size: '1g'
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
    command:
      [
        '-c',
        'shared_buffers=2GB',
        '-c',
        'max_parallel_workers=16',
        '-c',
        'max_wal_size=2GB',
        '-c',
        'effective_cache_size=6GB',
        '-c',
        'work_mem=32MB',
      ]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8gb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: otr-rabbitmq
    restart: unless-stopped
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${DOCKER_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${DOCKER_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stagecodes/otr-web:latest
    # The published images are amd64 only. Without this, an arm64 host (Apple
    # Silicon) finds no matching manifest and silently builds from the local
    # checkout instead of running the deployed image.
    platform: linux/amd64
    container_name: otr-migrate
    profiles:
      - migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      RABBITMQ_AMQP_URL: ${DOCKER_RABBITMQ_AMQP_URL}
    command: ['./scripts/run-migrations.sh']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: stagecodes/otr-web:latest
    # The published images are amd64 only. Without this, an arm64 host (Apple
    # Silicon) finds no matching manifest and silently builds from the local
    # checkout instead of running the deployed image.
    platform: linux/amd64
    container_name: otr-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      RABBITMQ_AMQP_URL: ${DOCKER_RABBITMQ_AMQP_URL}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otr-alloy:4318
      OTEL_SERVICE_NAME: otr-web
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4gb
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:3000/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  data-worker:
    build:
      context: .
      dockerfile: apps/data-worker/Dockerfile
    image: stagecodes/otr-data-worker:latest
    # The published images are amd64 only. Without this, an arm64 host (Apple
    # Silicon) finds no matching manifest and silently builds from the local
    # checkout instead of running the deployed image.
    platform: linux/amd64
    container_name: otr-data-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      RABBITMQ_AMQP_URL: ${DOCKER_RABBITMQ_AMQP_URL}
      METRICS_PORT: '9091'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otr-alloy:4318
      OTEL_SERVICE_NAME: otr-data-worker
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:9091/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The docs site. The image renders apps/docs with Quartz when it starts, then
  # serves it. Building it locally needs the apps/docs/quartz submodule.
  docs:
    build:
      context: apps/docs
    image: stagecodes/otr-docs:latest
    # The published images are amd64 only. Without this, an arm64 host (Apple
    # Silicon) finds no matching manifest and silently builds from the local
    # checkout instead of running the deployed image.
    platform: linux/amd64
    container_name: otr-docs
    restart: unless-stopped
    ports:
      - '8090:8080'

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: otr-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/prometheus/secrets
        echo -n "$${METRICS_AUTH_TOKEN}" > /etc/prometheus/secrets/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.enable-lifecycle \
          --web.enable-remote-write-receiver \
          --enable-feature=exemplar-storage \
          --enable-feature=native-histograms
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prod/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prod/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      - postgres-exporter
      - alertmanager

  # Sends the alerts Prometheus raises to Discord. Alertmanager cannot read the
  # webhook URL from the environment, so the entrypoint writes it to the file
  # monitoring/prod/alertmanager/alertmanager.yml reads.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: otr-alertmanager
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        (umask 077 && echo -n "$${DISCORD_WEBHOOK_URL}" > /tmp/discord_webhook_url)
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --cluster.listen-address=
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - alertmanager-data:/alertmanager
      - ./monitoring/prod/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    image: grafana/loki:3.7.3
    container_name: otr-loki
    restart: unless-stopped
    command:
      - '-config.file=/etc/loki/loki-config.yaml'
    volumes:
      - loki-data:/loki
      - ./monitoring/prod/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  tempo:
    image: grafana/tempo:3.0.3
    container_name: otr-tempo
    restart: unless-stopped
    command: ['-target=all', '-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./monitoring/prod/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      - prometheus

  alloy:
    image: grafana/alloy:v1.17.1
    container_name: otr-alloy
    restart: unless-stopped
    ports:
      # Loopback only so traces from a locally running app can reach the collector
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    command:
      - run
      - '--storage.path=/var/lib/alloy/data'
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/prod/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    container_name: otr-grafana
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/prod/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/prod/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: otr-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DOCKER_POSTGRES_DB:-postgres}?sslmode=disable
      DATA_SOURCE_USER: ${DOCKER_POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${DOCKER_POSTGRES_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.12.0
    container_name: otr-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    pid: host
    # Don't rename, will break disaster recovery
    profiles:
      - 'node-exporter'

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  alloy-data:
  loki-data:
  tempo-data:
