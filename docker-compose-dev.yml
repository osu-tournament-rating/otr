# Shared dev tier: database and queue only, used by every PR preview stack.
# Preview stacks attach to the `otr-dev` network and reach these by alias.
#
# The five variables below are the whole of the DEV_ENV secret. dev-db.sh
# sources the same .env for the postgres credentials, so they are defined once.
name: otr-dev

services:
  db:
    # otr-scripts recovery runs `docker compose stop db` in this directory,
    # so this service must stay named `db`.
    # Matches docker-compose.yml, so the dev tier runs production's version.
    # A dev tier deploy restarts the database when this line changes.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: otr-dev-db
    restart: unless-stopped
    shm_size: '256m'
    # Loopback only: previews reach postgres over the otr-dev network and
    # dev-db.sh goes through docker exec, so otr-scripts is the only consumer
    # of the published port and it connects on localhost.
    ports:
      - '127.0.0.1:5632:5432'
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
    volumes:
      - /c/otr-dev/postgres:/var/lib/postgresql/data
    # Disposable data, tuned for bulk restores
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=1GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
    networks:
      otr-dev:
        aliases:
          - otr-dev-db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    # Matches docker-compose.yml. A dev tier deploy restarts the broker when
    # this line changes.
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    container_name: otr-dev-rabbitmq
    restart: unless-stopped
    ports:
      - '127.0.0.1:5872:5672'
      - '127.0.0.1:15872:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${DOCKER_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${DOCKER_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      otr-dev:
        aliases:
          - otr-dev-rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  otr-dev:
    name: otr-dev

volumes:
  rabbitmq-data:
