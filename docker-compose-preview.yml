# Per-PR preview stack: website and its tailnet endpoint only.
# The database comes from the shared dev tier (docker-compose-dev.yml);
# the data worker deliberately does not run here, so previews make no osu! API
# calls. Deploy with a per-PR project name: `docker compose -p otr-pr-<n> up -d`.
# No service may declare container_name or previews would collide.
#
# Every variable below comes from the .env the workflow assembles: the
# PREVIEW_ENV secret, plus the per-PR lines it appends. The only keys that
# secret needs beyond the ones interpolated here are BETTER_AUTH_SECRET and the
# unused WEB_OSU_CLIENT_ID / WEB_OSU_CLIENT_SECRET placeholders, which reach the
# app through env_file. Previews sign in through the test-auth endpoint, so
# osu! OAuth is never called.

services:
  web:
    image: stagecodes/otr-web:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      BETTER_AUTH_URL: ${PREVIEW_URL}
      NEXT_PUBLIC_APP_BASE_URL: ${PREVIEW_URL}
      # The tailnet URL is served by the sidecar and is unreachable from this
      # container, so server-side rpc calls go to the app's own port.
      INTERNAL_APP_BASE_URL: http://localhost:3000
      # Pinned here rather than in .env so a preview cannot come up without
      # a login path or with admin mutations frozen by the maintenance window.
      E2E_TEST_AUTH: 'true'
      MAINTENANCE_WINDOW_ENABLED: 'false'
    networks:
      - default
      - otr-dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:3000/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Only for PRs that add migrations, which run against their own cloned
  # database. Never run this against the shared dev database.
  migrate:
    image: stagecodes/otr-web:${IMAGE_TAG}
    profiles:
      - migrate
    restart: 'no'
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    command: ['./scripts/run-migrations.sh']
    networks:
      - otr-dev

  tailscale:
    # Pinned so a redeploy's pull does not recreate the sidecar for a new
    # Tailscale release.
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    restart: unless-stopped
    environment:
      # OAuth client credentials mint an ephemeral node. Tailscale deletes it
      # some time after it goes offline; the teardown job logs it out at once.
      TS_CLIENT_ID: ${TS_CLIENT_ID}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET}
      TS_HOSTNAME: ${PREVIEW_HOSTNAME}
      TS_EXTRA_ARGS: --advertise-tags=tag:preview
      TS_SERVE_CONFIG: /config/serve.json
      # The node's identity outlives the container, so a recreated sidecar
      # comes back as the same node. A fresh one would find its hostname
      # still held by the old, offline node and take the name with -1
      # appended, which the URL in the preview comment does not reach.
      TS_STATE_DIR: /var/lib/tailscale
      # Log in only when the saved node needs it, such as after Tailscale
      # deleted it while the host was down.
      TS_AUTH_ONCE: 'true'
    volumes:
      # Must be a directory; Tailscale watches it for changes.
      - ./ts-config:/config
      - tailscale-state:/var/lib/tailscale
    depends_on:
      - web
    networks:
      - default

volumes:
  # Compose prefixes it with the project, so each preview has its own. The
  # teardown job removes it by that name.
  tailscale-state:

networks:
  otr-dev:
    external: true
